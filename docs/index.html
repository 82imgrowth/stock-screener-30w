<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30주선 위 종목 스크리너</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --text: #1a1d24; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --up: #d92c2c; --hover: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1c1f27; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2c3038; --accent: #60a5fa; --up: #f87171; --hover: #262a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input[type="search"] {
    flex: 1; min-width: 200px; padding: 10px 14px; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }
  select {
    padding: 10px 14px; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .table-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 640px; }
  th, td { padding: 10px 14px; text-align: right; white-space: nowrap; }
  th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead th {
    color: var(--muted); font-weight: 600; font-size: 0.8rem;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
    position: sticky; top: 0; background: var(--card);
  }
  thead th:hover { color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--hover); }
  .gap { color: var(--up); font-weight: 600; }
  .mkt { font-size: 0.75rem; color: var(--muted); }
  a.stock-link { color: var(--text); text-decoration: none; font-weight: 500; }
  a.stock-link:hover { color: var(--accent); text-decoration: underline; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .arrow { font-size: 0.7em; }
  tbody tr { cursor: pointer; }

  /* 차트 모달 */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 860px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-head .sub { color: var(--muted); font-size: 0.82rem; }
  .modal-head .gap-badge { color: var(--up); font-weight: 600; font-size: 0.9rem; }
  .modal-head a { margin-left: auto; color: var(--accent); font-size: 0.82rem; text-decoration: none; }
  .modal-close {
    background: none; border: none; color: var(--muted); font-size: 1.4rem;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  #chart-box { width: 100%; height: 420px; }
  .chart-hint { padding: 8px 18px 14px; color: var(--muted); font-size: 0.75rem; }
  @media (max-width: 640px) { #chart-box { height: 300px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>30주 이동평균선 위 종목</h1>
  <div class="meta" id="meta">데이터 로딩 중...</div>
  <div class="controls">
    <input type="search" id="search" placeholder="종목명 또는 코드 검색">
    <select id="market-filter">
      <option value="">전체 시장</option>
      <option value="KOSPI">코스피</option>
      <option value="KOSDAQ">코스닥</option>
    </select>
  </div>
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th data-key="name">종목명</th>
          <th data-key="market">시장</th>
          <th data-key="price">현재가</th>
          <th data-key="ma30">30주선</th>
          <th data-key="gap_pct">이격률 <span class="arrow" id="ar-gap_pct"></span></th>
          <th data-key="marcap">시가총액 <span class="arrow" id="ar-marcap">▼</span></th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="6" class="empty">로딩 중...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-name"></h2>
      <span class="sub" id="m-code"></span>
      <span class="gap-badge" id="m-gap"></span>
      <a id="m-naver" href="#" target="_blank" rel="noopener">네이버 금융 ↗</a>
      <button class="modal-close" id="m-close" aria-label="닫기">×</button>
    </div>
    <div id="chart-box"></div>
    <div class="chart-hint">주봉 · 주황선 = 30주 이동평균 · 하단 막대 = 거래량 · 휠/핀치로 줌, 드래그로 기간 이동</div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
let stocks = [];
let sortKey = "marcap", sortDesc = true;

const fmt = n => n.toLocaleString("ko-KR");
const fmtMarcap = n => {
  const jo = Math.floor(n / 1e12), eok = Math.round((n % 1e12) / 1e8);
  return jo > 0 ? `${jo}조 ${fmt(eok)}억` : `${fmt(eok)}억`;
};

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const mkt = document.getElementById("market-filter").value;
  let rows = stocks.filter(s =>
    (!mkt || s.market === mkt) &&
    (!q || s.name.toLowerCase().includes(q) || s.code.includes(q))
  );
  rows.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    const cmp = typeof va === "string" ? va.localeCompare(vb, "ko") : va - vb;
    return sortDesc ? -cmp : cmp;
  });
  document.querySelectorAll(".arrow").forEach(el => el.textContent = "");
  const ar = document.getElementById("ar-" + sortKey);
  if (ar) ar.textContent = sortDesc ? "▼" : "▲";

  const tbody = document.getElementById("tbody");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">조건에 맞는 종목이 없습니다</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(s => `
    <tr data-code="${s.code}">
      <td><span class="stock-link">${s.name}</span> <span class="mkt">${s.code}</span></td>
      <td class="mkt">${s.market}</td>
      <td>${fmt(s.price)}</td>
      <td>${fmt(Math.round(s.ma30))}</td>
      <td class="gap">+${s.gap_pct.toFixed(1)}%</td>
      <td>${fmtMarcap(s.marcap)}</td>
    </tr>`).join("");
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDesc = !sortDesc;
    else { sortKey = key; sortDesc = true; }
    render();
  });
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("market-filter").addEventListener("change", render);

// ── 차트 모달 ──
const modal = document.getElementById("modal");
let chart = null;

function themeColors() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--card").trim(),
    text: css.getPropertyValue("--muted").trim(),
    grid: dark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.06)",
  };
}

function openChart(s) {
  document.getElementById("m-name").textContent = s.name;
  document.getElementById("m-code").textContent = `${s.code} · ${s.market}`;
  document.getElementById("m-gap").textContent = `30주선 +${s.gap_pct.toFixed(1)}%`;
  document.getElementById("m-naver").href = `https://finance.naver.com/item/main.naver?code=${s.code}`;
  modal.classList.add("open");

  const box = document.getElementById("chart-box");
  if (chart) { chart.remove(); chart = null; }
  box.textContent = "";

  fetch(`charts/${s.code}.json`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      if (!modal.classList.contains("open")) return;
      const c = themeColors();
      chart = LightweightCharts.createChart(box, {
        layout: { background: { color: c.bg }, textColor: c.text },
        grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
        rightPriceScale: { borderVisible: false },
        timeScale: { borderVisible: false },
        localization: { locale: "ko-KR", priceFormatter: p => p.toLocaleString("ko-KR") },
      });
      // 한국식 색상: 상승 빨강, 하락 파랑
      chart.addCandlestickSeries({
        upColor: "#e5484d", wickUpColor: "#e5484d", borderUpColor: "#e5484d",
        downColor: "#3b82f6", wickDownColor: "#3b82f6", borderDownColor: "#3b82f6",
      }).setData(d.candles);
      // 거래량: 하단 20% 영역에 반투명 히스토그램
      chart.addHistogramSeries({
        priceFormat: { type: "volume" },
        priceScaleId: "vol",
        lastValueVisible: false, priceLineVisible: false,
      }).setData(d.candles.map(c => ({
        time: c.time,
        value: c.volume || 0,
        color: c.close >= c.open ? "rgba(229,72,77,0.4)" : "rgba(59,130,246,0.4)",
      })));
      chart.priceScale("vol").applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 },
        visible: false,
      });
      chart.priceScale("right").applyOptions({
        scaleMargins: { top: 0.05, bottom: 0.25 },
      });
      chart.addLineSeries({
        color: "#f59e0b", lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      }).setData(d.ma30);
      // 초기 화면은 최근 1년, 이후 휠/드래그로 자유 조절
      const from = d.candles[Math.max(0, d.candles.length - 52)].time;
      chart.timeScale().setVisibleRange({ from, to: d.candles[d.candles.length - 1].time });
    })
    .catch(() => { box.innerHTML = '<div class="empty">차트 데이터를 불러오지 못했습니다</div>'; });
}

function closeChart() {
  modal.classList.remove("open");
  if (chart) { chart.remove(); chart = null; }
}
document.getElementById("m-close").addEventListener("click", closeChart);
modal.addEventListener("click", e => { if (e.target === modal) closeChart(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChart(); });

document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-code]");
  if (!tr) return;
  const s = stocks.find(x => x.code === tr.dataset.code);
  if (s) openChart(s);
});

new ResizeObserver(() => {
  if (chart) {
    const box = document.getElementById("chart-box");
    chart.resize(box.clientWidth, box.clientHeight);
  }
}).observe(document.getElementById("chart-box"));

fetch("data.json")
  .then(r => r.json())
  .then(d => {
    stocks = d.stocks;
    document.getElementById("meta").textContent =
      `기준: ${d.updated} · 전체 ${fmt(d.total_scanned)}종목 중 ${fmt(d.count)}종목 (${(d.count / d.total_scanned * 100).toFixed(1)}%)이 30주선 위`;
    render();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "data.json을 불러오지 못했습니다. 스크리닝을 먼저 실행하세요.";
    document.getElementById("tbody").innerHTML = '<tr><td colspan="6" class="empty">데이터 없음</td></tr>';
  });
</script>
</body>
</html>
