<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30주선 위 종목 스크리너</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --text: #1a1d24; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --up: #d92c2c; --hover: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1c1f27; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2c3038; --accent: #60a5fa; --up: #f87171; --hover: #262a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5;
  }
  /* 섹터 열이 늘어 표가 1100px 안팎을 쓴다. 960px로 묶으면 시가총액이 잘려
     가로 드래그가 필요해지므로 넓은 화면에서는 창에 맞춰 넓어지게 둔다. */
  .wrap { max-width: 1280px; margin: 0 auto; }
  .topnav { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .topnav a {
    padding: 8px 16px; font-size: 0.92rem; font-weight: 600; text-decoration: none;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .topnav a:hover { color: var(--text); }
  .topnav a.active { color: var(--accent); border-bottom-color: var(--accent); }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input[type="search"] {
    flex: 1; min-width: 200px; padding: 10px 14px; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }
  select {
    padding: 10px 14px; font-size: 0.9rem; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .table-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  /* 폰·노트북을 한 규칙으로 대응한다. 열 너비를 비율로 고정(table-layout: fixed)해
     숫자 열이 폭을 독식하지 못하게 막고, 남는 폭에서 글자 크기가 창에 따라 줄며,
     모자라면 텍스트가 최대 3줄까지 넘어간다. 어느 폭에서도 열을 숨기지 않는다.
     (auto 레이아웃에서는 375px에서 섹터가 5줄까지 쪼개졌다) */
  /* 주의: 이 표 규칙은 반드시 .table-box 안으로 한정한다. Lightweight Charts가
     차트를 내부 <table>로 그려서, 전역 table/td 규칙을 두면 차트의 가격축 칸까지
     고정 너비로 눌려 축 숫자가 잘린다(실제로 33px까지 줄었음). */
  .table-box table {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-size: clamp(9px, calc(5.1px + 0.83vw), 0.9rem);
  }
  .table-box th, .table-box td {
    padding: clamp(4px, calc(-1px + 0.75vw), 10px) clamp(2px, calc(-6.5px + 1.55vw), 12px);
    text-align: right; white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
  }
  /* 숫자는 중간에서 쪼개지면 오독되므로 한 줄 유지 */
  .table-box td:nth-child(5), .table-box td:nth-child(6),
  .table-box td:nth-child(7), .table-box td:nth-child(8),
  .num-col { white-space: nowrap; overflow-wrap: normal; }
  .table-box th:nth-child(1), .table-box td:nth-child(1) { width: 9%; }
  .table-box th:nth-child(2), .table-box td:nth-child(2) { width: 17%; }
  .table-box th:nth-child(3), .table-box td:nth-child(3) { width: 7%; }
  .table-box th:nth-child(4), .table-box td:nth-child(4) { width: 13%; }
  .table-box th:nth-child(5), .table-box td:nth-child(5) { width: 12%; }
  .table-box th:nth-child(6), .table-box td:nth-child(6) { width: 12%; }
  .table-box th:nth-child(7), .table-box td:nth-child(7) { width: 11.5%; }
  .table-box th:nth-child(8), .table-box td:nth-child(8) { width: 7.5%; }
  .table-box th:nth-child(9), .table-box td:nth-child(9) { width: 11%; }
  .table-box th:nth-child(2), .table-box td:nth-child(2),
  .table-box th:nth-child(3), .table-box td:nth-child(3),
  .table-box th:nth-child(4), .table-box td:nth-child(4) { text-align: left; }
  .sector-col { color: var(--muted); font-size: 0.82em; }
  .sector-col span { display: inline; }
  .table-box thead th {
    color: var(--muted); font-weight: 600; font-size: 0.8rem;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
    position: sticky; top: 0; background: var(--card);
  }
  .table-box thead th:hover { color: var(--accent); }
  .num-col { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; padding-right: 4px; width: 1%; white-space: nowrap; }
  .table-box thead th.num-col { cursor: default; }
  .table-box thead th.num-col:hover { color: var(--muted); }
  .table-box tbody tr.is-new { background: rgba(217, 44, 44, 0.06); }
  .table-box tbody tr.is-new:hover { background: rgba(217, 44, 44, 0.12); }
  @media (prefers-color-scheme: dark) {
    .table-box tbody tr.is-new { background: rgba(248, 113, 113, 0.10); }
    .table-box tbody tr.is-new:hover { background: rgba(248, 113, 113, 0.18); }
  }
  /* 신규 진입(최근 3일 내 30주선 상향돌파) 표시 */
  .new-badge {
    display: inline-block; margin-right: 6px; padding: 1px 5px;
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em; line-height: 1.4;
    color: #fff; background: var(--up); border-radius: 4px; vertical-align: middle;
    white-space: nowrap;
  }
  .new-badge i { font-style: normal; }
  .table-box tbody tr { border-bottom: 1px solid var(--border); }
  .table-box tbody tr:last-child { border-bottom: none; }
  .table-box tbody tr:hover { background: var(--hover); }
  .gap { color: var(--up); font-weight: 600; }
  .mkt { font-size: 0.75rem; color: var(--muted); }
  a.stock-link { color: var(--text); text-decoration: none; font-weight: 500; }
  a.stock-link:hover { color: var(--accent); text-decoration: underline; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .arrow { font-size: 0.7em; }
  .table-box tbody tr { cursor: pointer; }

  /* 차트 모달 */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 1140px; overflow: hidden;
    display: flex; flex-direction: column; max-height: 92vh;
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-head .sub { color: var(--muted); font-size: 0.82rem; }
  .modal-head .gap-badge { color: var(--up); font-weight: 600; font-size: 0.9rem; }
  .modal-head .gap-badge.down { color: var(--down); }
  .modal-head a { margin-left: auto; color: var(--accent); font-size: 0.82rem; text-decoration: none; }
  .modal-close {
    background: none; border: none; color: var(--muted); font-size: 1.4rem;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }
  /* 차트(왼쪽) + 증권사 리포트(오른쪽). 좁은 화면에서는 리포트가 차트 아래로 내려간다. */
  /* 리포트가 많은 종목(삼성전자 165건)에서도 팝업이 늘어나지 않게 body를 가두고
     목록만 안에서 스크롤시킨다 */
  .modal-body { display: flex; align-items: stretch; min-height: 0; overflow: hidden; }
  /* 리포트 목록이 길어 팝업이 커지면 차트가 위쪽에 붙어 아래 여백이 크게 남는다.
     남는 공간을 위아래로 나눠 차트를 세로 중앙에 둔다. */
  .chart-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  #chart-box { width: 100%; height: 420px; }
  .chart-hint { padding: 8px 18px 14px; color: var(--muted); font-size: 0.75rem; }
  .report-pane {
    flex: 0 0 278px; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .report-pane h3 {
    font-size: 0.85rem; padding: 12px 14px 8px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .report-pane h3 span { font-weight: 400; }
  #report-list { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 4px 0; }
  .rp-item {
    display: block; padding: 9px 14px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--border);
  }
  .rp-item:last-child { border-bottom: none; }
  .rp-item:hover { background: var(--hover); }
  .rp-title { font-size: 0.82rem; line-height: 1.35; margin-bottom: 3px; word-break: keep-all; }
  .rp-meta { font-size: 0.72rem; color: var(--muted); }
  .rp-pdf { color: var(--accent); }
  .rp-empty { padding: 24px 14px; text-align: center; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
  @media (max-width: 900px) {
    .modal-body { flex-direction: column; }
    .report-pane { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--border); max-height: 210px; }
  }
  @media (max-width: 640px) { #chart-box { height: 300px; } }

  /* 좁은 화면 보정 — 뒤에 오는 .num-col/.new-badge 기본 규칙을 덮어야 하므로 맨 끝에 둔다.
     NEW 배지를 순번 위로 올려 # 열이 넓어지는 걸 막는다. */
  @media (max-width: 700px) {
    .num-col { white-space: normal; padding-right: 2px; }
    .new-badge { display: block; font-size: 0.55rem; padding: 0 2px; margin: 0 0 1px; }
    /* 폰 폭에서 'NEW_2DAY'는 # 열(31px)에 안 들어가 세 줄로 쪼개진다(배지 높이 37px).
       구분에 필요한 정보는 숫자뿐이라 '_'와 'DAY'만 감춰 'NEW2'로 줄인다.
       자간까지 죽여야 29px → 27px 안에 들어간다. */
    .new-badge i { display: none; }
    .new-badge { padding: 0 1px; letter-spacing: 0; }
  }
  /* 폰 폭에서는 KOSPI→KP, KOSDAQ→KQ로 줄이고 남는 폭을 종목명·섹터에 돌린다 */
  .m-abbr { display: none; }
  @media (max-width: 520px) {
    .m-full { display: none; }
    .m-abbr { display: inline; }
    .table-box th:nth-child(3), .table-box td:nth-child(3) { width: 5%; }
    .table-box th:nth-child(2), .table-box td:nth-child(2) { width: 18%; }
    .table-box th:nth-child(4), .table-box td:nth-child(4) { width: 14%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html" class="active">30Weeks</a>
    <a href="sector.html">섹터 히트맵</a>
    <a href="theme.html">테마</a>
  </nav>
  <h1>30주 이동평균선 위 종목</h1>
  <div class="meta" id="meta">데이터 로딩 중...</div>
  <div class="controls">
    <input type="search" id="search" placeholder="종목명 또는 코드 검색">
    <select id="market-filter">
      <option value="">코스피+코스닥</option>
      <option value="KOSPI">코스피</option>
      <option value="KOSDAQ">코스닥</option>
      <option value="ETF">ETF</option>
    </select>
    <select id="new-filter">
      <option value="">전체 종목</option>
      <option value="all">NEW_ALL</option>
      <option value="1">NEW_1DAY</option>
      <option value="2">NEW_2DAY</option>
      <option value="3">NEW_3DAY</option>
    </select>
  </div>
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th class="num-col">#</th>
          <th data-key="name">종목명</th>
          <th data-key="market">시장</th>
          <th data-key="sector">섹터 <span class="arrow" id="ar-sector"></span></th>
          <th data-key="price">현재가</th>
          <th data-key="ma30">30주선</th>
          <th data-key="gap_pct">이격률 <span class="arrow" id="ar-gap_pct"></span></th>
          <th data-key="weeks_above" title="30주선 상향돌파 후 연속으로 위에 머문 기간">기간 <span class="arrow" id="ar-weeks_above"></span></th>
          <th data-key="marcap">시가총액 <span class="arrow" id="ar-marcap">▼</span></th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="9" class="empty">로딩 중...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-name"></h2>
      <span class="sub" id="m-code"></span>
      <span class="gap-badge" id="m-gap"></span>
      <a id="m-naver" href="#" target="_blank" rel="noopener">네이버 금융 ↗</a>
      <button class="modal-close" id="m-close" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <div class="chart-pane">
        <div id="chart-box"></div>
        <div class="chart-hint">주봉 · 주황선 = 30주 이동평균 · 하단 막대 = 거래량 · 휠/핀치로 줌, 드래그로 기간 이동</div>
      </div>
      <aside class="report-pane">
        <h3>증권사 리포트 <span id="rp-count"></span></h3>
        <div id="report-list"></div>
      </aside>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
let stocks = [];
let reports = null;   // { 종목코드: [{title, broker, date, pdf, nid}] }
let sortKey = "marcap", sortDesc = true;

// 폰 폭에서는 시장명을 줄여 표시(ETF는 이미 짧아 그대로)
const MKT_ABBR = { KOSPI: "KP", KOSDAQ: "KQ" };

const fmt = n => n.toLocaleString("ko-KR");
const fmtMarcap = n => {
  const jo = Math.floor(n / 1e12), eok = Math.round((n % 1e12) / 1e8);
  return jo > 0 ? `${jo}조 ${fmt(eok)}억` : `${fmt(eok)}억`;
};

// 30주선 진입 후 며칠째인지로 NEW를 세 단계로 나눈다.
// 진입 당일 = NEW_1DAY, 다음날 = NEW_2DAY, 그다음날 = NEW_3DAY, 그 이후는 NEW 아님.
// 한 종목은 셋 중 하나에만 속한다(겹치지 않음). NEW_ALL이 셋을 합쳐 보여준다.
const NEW_DAYS = 3;
let newFilter = "";       // "" 전체 | "all" 셋 다 | "1" | "2" | "3"
function newAge(s) {
  if (!s.since) return 0;
  const days = (Date.now() - new Date(s.since + "T00:00:00").getTime()) / 86400000;
  if (days < 0 || days >= NEW_DAYS) return 0;
  return Math.floor(days) + 1;   // 0일차 → 1, 1일차 → 2, 2일차 → 3
}
const isNew = s => newAge(s) > 0;
function matchesNew(s) {
  if (!newFilter) return true;
  const n = newAge(s);
  return newFilter === "all" ? n > 0 : n === Number(newFilter);
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const mkt = document.getElementById("market-filter").value;
  let rows = stocks.filter(s =>
    // 기본 화면은 개별 종목만 본다. ETF는 필터에서 직접 고를 때만 나온다.
    (mkt ? s.market === mkt : s.market !== "ETF") &&
    matchesNew(s) &&
    (!q || s.name.toLowerCase().includes(q) || s.code.includes(q))
  );
  rows.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    const cmp = typeof va === "string" ? va.localeCompare(vb, "ko") : va - vb;
    return sortDesc ? -cmp : cmp;
  });
  document.querySelectorAll(".arrow").forEach(el => el.textContent = "");
  const ar = document.getElementById("ar-" + sortKey);
  if (ar) ar.textContent = sortDesc ? "▼" : "▲";

  const tbody = document.getElementById("tbody");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">조건에 맞는 종목이 없습니다</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map((s, i) => `
    <tr data-code="${s.code}"${isNew(s) ? ' class="is-new"' : ''}>
      <td class="num-col">${newAge(s)
        ? `<span class="new-badge">NEW<i>_</i>${newAge(s)}<i>DAY</i></span>` : ''}${i + 1}</td>
      <td><span class="stock-link">${s.name}</span> <span class="mkt">${s.code}</span></td>
      <td class="mkt"><span class="m-full">${s.market}</span><span class="m-abbr">${MKT_ABBR[s.market] || s.market}</span></td>
      <td class="sector-col"><span title="${s.sector || ""}">${s.sector || "-"}</span></td>
      <td>${fmt(s.price)}</td>
      <td>${fmt(Math.round(s.ma30))}</td>
      <td class="gap">+${s.gap_pct.toFixed(1)}%</td>
      <td>${s.weeks_above != null ? s.weeks_above + "주" : "-"}</td>
      <td>${fmtMarcap(s.marcap)}</td>
    </tr>`).join("");
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (!key) return;  // # 열은 정렬 대상 아님
    if (sortKey === key) sortDesc = !sortDesc;
    else { sortKey = key; sortDesc = true; }
    render();
  });
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("market-filter").addEventListener("change", render);
document.getElementById("new-filter").addEventListener("change", e => {
  newFilter = e.currentTarget.value;
  render();
});

// ── 차트 모달 ──
const modal = document.getElementById("modal");
let chart = null;

// 차트 JSON은 용량 때문에 압축 형식이다(종목당 22.7KB → 6.5KB). 30주선 아래
// 종목까지 차트를 만들면 파일이 2,450개라 원래 형식으로는 53MB가 된다.
//   t0: 첫 봉 날짜, d: t0로부터 며칠 뒤인지, c: [시,고,저,종,거래량], m: 30주선
// 예전 형식({candles, ma30})으로 받은 파일도 그대로 통한다.
function expandChart(d) {
  if (d.candles) return d;                       // 구 형식
  const t0 = Date.parse(d.t0 + "T00:00:00Z"), DAY = 86400000;
  const candles = d.d.map((off, i) => {
    const c = d.c[i];
    return {
      time: new Date(t0 + off * DAY).toISOString().slice(0, 10),
      open: c[0], high: c[1], low: c[2], close: c[3], volume: c[4],
    };
  });
  const ma30 = [];
  d.m.forEach((v, i) => { if (v != null) ma30.push({ time: candles[i].time, value: v }); });
  return { candles, ma30 };
}

function themeColors() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--card").trim(),
    text: css.getPropertyValue("--muted").trim(),
    grid: dark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.06)",
  };
}

const esc = t => String(t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

// 증권사 리포트 목록. PDF가 있으면 원문으로, 없으면 네이버 상세 페이지로 연결.
function renderReports(code) {
  const list = document.getElementById("report-list");
  const cnt = document.getElementById("rp-count");
  if (!reports) {                       // reports.json이 아직/영영 없을 때
    cnt.textContent = "";
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">리포트 정보를 불러오는 중…</div>';
    return;
  }
  const items = reports[code] || [];
  cnt.textContent = items.length ? `${items.length}건` : "";
  if (!items.length) {
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">등록된 리포트가 없습니다.<br>증권사 리포트는 주로 대형·중형주에 나옵니다.</div>';
    return;
  }
  list.innerHTML = items.map(r => {
    const href = r.pdf || `https://finance.naver.com/research/company_read.naver?nid=${r.nid}`;
    return `<a class="rp-item" href="${esc(href)}" target="_blank" rel="noopener">
      <div class="rp-title">${esc(r.title)}</div>
      <div class="rp-meta">${esc(r.broker)} · ${esc(r.date)}${r.pdf ? ' · <span class="rp-pdf">PDF</span>' : ""}</div>
    </a>`;
  }).join("");
  list.scrollTop = 0;
  capListHeight(list);
}

// 목록은 10개까지만 보이고 나머지는 스크롤. 제목 길이에 따라 항목 높이가 달라
// 고정 px 대신 10번째 항목의 실제 위치로 높이를 잡는다.
const REPORT_VISIBLE = 10;
function capListHeight(list) {
  list.style.maxHeight = "";
  const items = list.querySelectorAll(".rp-item");
  if (items.length <= REPORT_VISIBLE) return;   // 적으면 제한 없이 그대로
  const cs = getComputedStyle(list);   // 목록 위아래 여백을 더해야 마지막 항목이 안 잘린다
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const fit = () => {
    const it = list.querySelectorAll(".rp-item");
    return Math.ceil(it[REPORT_VISIBLE - 1].getBoundingClientRect().bottom
                     - it[0].getBoundingClientRect().top + pad);
  };
  // 높이를 줄이면 스크롤바가 생겨 폭이 좁아지고 제목이 다시 줄바꿈돼 항목이 커진다.
  // 그래서 한 번 적용한 뒤 다시 재서 맞춘다.
  list.style.maxHeight = fit() + "px";
  list.style.maxHeight = fit() + "px";
}

function openChart(s) {
  document.getElementById("m-name").textContent = s.name;
  document.getElementById("m-code").textContent = `${s.code} · ${s.market}`;
  // 30주선 아래 종목(테마 화면)은 이격률이 음수라 부호와 색을 나눈다
  const gap = document.getElementById("m-gap");
  gap.textContent = `30주선 ${s.gap_pct >= 0 ? "+" : ""}${s.gap_pct.toFixed(1)}%`;
  gap.classList.toggle("down", s.gap_pct < 0);
  document.getElementById("m-naver").href = `https://finance.naver.com/item/main.naver?code=${s.code}`;
  modal.classList.add("open");
  renderReports(s.code);

  const box = document.getElementById("chart-box");
  if (chart) { chart.remove(); chart = null; }
  box.textContent = "";

  // 데이터 갱신 시각을 버전으로 붙여 갱신 때마다 새 URL로 요청 (캐시된 옛 차트 방지)
  fetch(`charts/${s.code}.json?v=${encodeURIComponent(dataVersion)}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(raw => {
      const d = expandChart(raw);
      if (!modal.classList.contains("open")) return;
      const c = themeColors();
      chart = LightweightCharts.createChart(box, {
        layout: { background: { color: c.bg }, textColor: c.text },
        grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
        // 국내 주가는 '1,645,000'처럼 자릿수가 길어 기본 축 폭에서 잘린다
        rightPriceScale: { borderVisible: false, minimumWidth: 76 },
        timeScale: { borderVisible: false },
        localization: { locale: "ko-KR", priceFormatter: p => p.toLocaleString("ko-KR") },
      });
      // 한국식 색상: 상승 빨강, 하락 파랑
      chart.addCandlestickSeries({
        upColor: "#e5484d", wickUpColor: "#e5484d", borderUpColor: "#e5484d",
        downColor: "#3b82f6", wickDownColor: "#3b82f6", borderDownColor: "#3b82f6",
        // 거래량 자리(하단 25%)를 비우느라 축이 0 아래까지 내려가 '-400,000' 같은
        // 없는 가격이 찍혔다. 0 미만으로는 안 내려가게 막는다.
        autoscaleInfoProvider: orig => {
          const r = orig();
          if (r && r.priceRange) r.priceRange.minValue = Math.max(0, r.priceRange.minValue);
          return r;
        },
      }).setData(d.candles);
      // 거래량: 하단 20% 영역에 반투명 히스토그램
      chart.addHistogramSeries({
        priceFormat: { type: "volume" },
        priceScaleId: "vol",
        lastValueVisible: false, priceLineVisible: false,
      }).setData(d.candles.map(c => ({
        time: c.time,
        value: c.volume || 0,
        color: c.close >= c.open ? "rgba(229,72,77,0.4)" : "rgba(59,130,246,0.4)",
      })));
      chart.priceScale("vol").applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 },
        visible: false,
      });
      chart.priceScale("right").applyOptions({
        scaleMargins: { top: 0.05, bottom: 0.25 },
      });
      chart.addLineSeries({
        color: "#f59e0b", lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      }).setData(d.ma30);
      // 초기 화면은 최근 1년, 이후 휠/드래그로 자유 조절
      const from = d.candles[Math.max(0, d.candles.length - 52)].time;
      chart.timeScale().setVisibleRange({ from, to: d.candles[d.candles.length - 1].time });
    })
    .catch(() => { box.innerHTML = '<div class="empty">차트 데이터를 불러오지 못했습니다</div>'; });
}

function closeChart() {
  modal.classList.remove("open");
  if (chart) { chart.remove(); chart = null; }
}
document.getElementById("m-close").addEventListener("click", closeChart);
modal.addEventListener("click", e => { if (e.target === modal) closeChart(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChart(); });

document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-code]");
  if (!tr) return;
  const s = stocks.find(x => x.code === tr.dataset.code);
  if (s) openChart(s);
});

new ResizeObserver(() => {
  if (chart) {
    const box = document.getElementById("chart-box");
    chart.resize(box.clientWidth, box.clientHeight);
  }
}).observe(document.getElementById("chart-box"));

// 리포트는 부가 정보라 실패해도 페이지는 그대로 동작해야 한다
fetch("reports.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : null))
  .then(d => {
    reports = (d && d.reports) || {};
    if (modal.classList.contains("open")) {
      const code = document.getElementById("m-code").textContent.split(" ")[0];
      renderReports(code);
    }
  })
  .catch(() => { reports = {}; });

let dataVersion = "";
fetch("data.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => {
    stocks = d.stocks;
    dataVersion = d.updated;
    // 기본 화면이 개별 종목만 보여주므로 요약도 주식/ETF를 나눠 적는다
    const eq = stocks.filter(s => s.market !== "ETF");
    const etfCount = d.count - eq.length;
    const newCount = eq.filter(isNew).length;
    let metaText =
      `기준: ${d.updated} · 전체 ${fmt(d.total_scanned)}종목 중 ${fmt(d.count)}종목 (${(d.count / d.total_scanned * 100).toFixed(1)}%)이 30주선 위` +
      ` · 코스피+코스닥 ${fmt(eq.length)}종목` + (etfCount ? ` · ETF ${fmt(etfCount)}종목` : "");
    if (newCount) {
      const by = n => eq.filter(s => newAge(s) === n).length;
      metaText += ` · 최근 진입 ${fmt(newCount)}종목` +
        ` (NEW_1DAY ${by(1)} · NEW_2DAY ${by(2)} · NEW_3DAY ${by(3)})`;
    }
    const meta = document.getElementById("meta");
    if (d.unverified && d.unverified.length) {
      metaText += ` · ⚠ 데이터 오류로 판정 못한 종목 ${d.unverified.length}개`;
      meta.title = d.unverified.map(u => `${u.name}(${u.code})`).join(", ");
    }
    meta.textContent = metaText;
    render();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "data.json을 불러오지 못했습니다. 스크리닝을 먼저 실행하세요.";
    document.getElementById("tbody").innerHTML = '<tr><td colspan="9" class="empty">데이터 없음</td></tr>';
  });
</script>
</body>
</html>
