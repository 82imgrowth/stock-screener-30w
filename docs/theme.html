<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테마 · 30주선 위 종목</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --text: #1a1d24; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --up: #d92c2c; --down: #3b82f6; --hover: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1c1f27; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2c3038; --accent: #60a5fa; --up: #f87171; --down: #60a5fa; --hover: #262a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .topnav { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .topnav a {
    padding: 8px 16px; font-size: 0.92rem; font-weight: 600; text-decoration: none;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .topnav a:hover { color: var(--text); }
  .topnav a.active { color: var(--accent); border-bottom-color: var(--accent); }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .controls { display: flex; gap: 8px; margin-bottom: 14px; }
  .controls input[type="search"] {
    flex: 1; min-width: 200px; padding: 10px 14px; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }

  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 34px; flex-wrap: wrap; }
  .crumb button {
    padding: 6px 12px; font-size: 0.85rem; cursor: pointer; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 7px;
  }
  .crumb button:hover { color: var(--text); }
  .crumb .cur { font-weight: 700; font-size: 1rem; }
  .crumb .cnt { color: var(--muted); font-size: 0.85rem; }

  /* 히트맵 */
  #heatmap { position: relative; width: 100%; height: 620px; background: var(--border); border-radius: 10px; overflow: hidden; }
  /* squarified treemap은 짧은 변을 기준으로 줄을 쌓는다. 그래서 컨테이너가
     가로로 길면 타일이 좌우로, 세로로 길면 위아래로 진행한다.
     PC(넓음)는 가로형, 모바일(좁음)은 세로형이 되도록 높이를 나눈다. */
  #heatmap.sector-view { height: 820px; }
  @media (max-width: 760px) {
    #heatmap.sector-view { height: 1360px; }
  }
  .tile {
    position: absolute; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 2px; transition: filter .12s;
  }
  .tile:hover { filter: brightness(1.25); z-index: 5; }
  .tile .t-name { font-weight: 700; line-height: 1.08; word-break: break-all; }
  .tile .t-val { opacity: .9; line-height: 1.2; }
  /* 최근 3일 내 30주선 진입 종목 */
  .tile-new { outline: 2px solid #ffd400; outline-offset: -2px; }
  .tile-new::after {              /* 타일이 작아 글자를 못 넣을 때도 보이는 표식 */
    content: ""; position: absolute; top: 0; right: 0;
    border-width: 0 9px 9px 0; border-style: solid;
    border-color: transparent #ffd400 transparent transparent;
  }
  .tile .t-new {
    font-size: 8px; font-weight: 800; letter-spacing: .04em;
    background: #ffd400; color: #1a1d24; padding: 0 4px; border-radius: 3px; margin-bottom: 2px;
  }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.75rem; color: var(--muted); flex-wrap: wrap; }
  .legend i { width: 22px; height: 11px; display: inline-block; border-radius: 2px; }
  #scale-toggle {
    padding: 3px 9px; font-size: 0.72rem; cursor: pointer; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  }
  #scale-toggle:hover { color: var(--text); }
  #scale-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  /* 테마 순위 목록 — 테마는 중복 소속이라 면적 분할보다 줄 단위 비교가 정확하다 */
  #theme-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tl-row {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 92px 64px;
    align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  #theme-list .tl-row { cursor: pointer; }
  #theme-list .tl-row:last-child { border-bottom: none; }
  #theme-list .tl-row:hover { background: var(--hover); }
  .tl-head {
    color: var(--muted); font-weight: 600; font-size: 0.78rem;
    position: sticky; top: 0; background: var(--card); z-index: 1;
  }
  .tl-head [data-sort] { cursor: pointer; user-select: none; }
  .tl-head [data-sort]:hover { color: var(--accent); }
  .tl-head .tl-bar-head, .tl-head .tl-num, .tl-head .tl-new { text-align: right; }
  .arrow { font-size: 0.7em; }
  .tl-rank { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .tl-name { font-weight: 600; font-size: 0.88rem; word-break: keep-all; }
  .tl-head .tl-name { font-weight: 600; font-size: 0.78rem; }
  /* 막대는 0~100% 절대 눈금. 25/50/75% 위치에 옅은 눈금선을 깔아 길이를 읽게 한다 */
  .tl-bar {
    height: 12px; border-radius: 6px; overflow: hidden; position: relative;
    background:
      repeating-linear-gradient(to right, transparent 0 24.6%, var(--border) 24.6% 25%),
      var(--hover);
  }
  .tl-bar i { display: block; height: 100%; border-radius: 6px; background: var(--up); }
  .tl-num { font-size: 0.8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tl-num b { color: var(--text); font-weight: 700; }
  .tl-pct { font-size: 0.8rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .tl-new { font-size: 0.72rem; text-align: right; }
  .tl-new span {
    background: #ffd400; color: #1a1d24; padding: 1px 5px; border-radius: 4px; font-weight: 700;
  }
  @media (max-width: 640px) {
    .tl-row { grid-template-columns: 26px minmax(0, 1fr) 74px 68px; gap: 7px; padding: 8px 10px; }
    .tl-new { display: none; }
  }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  /* 30주선 아래 구성종목 — 차트 데이터가 없어(스크리닝 통과분만 생성) 이름만 나열한다 */
  #below-box { margin-top: 18px; }
  .below-head { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
  .below-head b { color: var(--text); }
  .below-sort { opacity: .75; }
  #below-list {
    display: flex; flex-wrap: wrap; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
  }
  #below-list button {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-size: 0.8rem; font-family: inherit; color: var(--text); cursor: pointer;
    background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  }
  #below-list button:hover { background: var(--hover); border-color: var(--accent); }
  #below-list button i { font-style: normal; font-size: 0.72rem; color: var(--down); }

  /* 차트 모달 (30Weeks 페이지와 동일) */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 1140px; overflow: hidden;
    display: flex; flex-direction: column; max-height: 92vh;
  }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-head .sub { color: var(--muted); font-size: 0.82rem; }
  .modal-head .gap-badge { color: var(--up); font-weight: 600; font-size: 0.9rem; }
  .modal-head .gap-badge.down { color: var(--down); }
  .modal-head a { margin-left: auto; color: var(--accent); font-size: 0.82rem; text-decoration: none; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 0 4px; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  /* 차트(왼쪽) + 증권사 리포트(오른쪽). 좁은 화면에서는 리포트가 차트 아래로 내려간다. */
  /* 리포트가 많은 종목(삼성전자 165건)에서도 팝업이 늘어나지 않게 body를 가두고
     목록만 안에서 스크롤시킨다 */
  .modal-body { display: flex; align-items: stretch; min-height: 0; overflow: hidden; }
  /* 리포트 목록이 길어 팝업이 커지면 차트가 위쪽에 붙어 아래 여백이 크게 남는다.
     남는 공간을 위아래로 나눠 차트를 세로 중앙에 둔다. */
  .chart-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  #chart-box { width: 100%; height: 420px; }
  .chart-hint { padding: 8px 18px 14px; color: var(--muted); font-size: 0.75rem; }
  .report-pane {
    flex: 0 0 278px; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .report-pane h3 {
    font-size: 0.85rem; padding: 12px 14px 8px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .report-pane h3 span { font-weight: 400; }
  #report-list { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 4px 0; }
  .rp-item {
    display: block; padding: 9px 14px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--border);
  }
  .rp-item:last-child { border-bottom: none; }
  .rp-item:hover { background: var(--hover); }
  .rp-title { font-size: 0.82rem; line-height: 1.35; margin-bottom: 3px; word-break: keep-all; }
  .rp-meta { font-size: 0.72rem; color: var(--muted); }
  .rp-pdf { color: var(--accent); }
  .rp-empty { padding: 24px 14px; text-align: center; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
  @media (max-width: 900px) {
    .modal-body { flex-direction: column; }
    .report-pane { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--border); max-height: 210px; }
  }
  @media (max-width: 640px) { #chart-box { height: 300px; } }
</style>

<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html">30Weeks</a>
    <a href="sector.html">섹터 히트맵</a>
    <a href="theme.html" class="active">테마</a>
  </nav>
  <h1>테마별 30주선 위 비중</h1>
  <div class="meta" id="meta">데이터 로딩 중...</div>
  <div class="controls" id="controls">

</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-name"></h2>
      <span class="sub" id="m-code"></span>
      <span class="gap-badge" id="m-gap"></span>
      <a id="m-naver" href="#" target="_blank" rel="noopener">네이버 금융 ↗</a>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
let stocks = [], dataVersion = "", currentSector = null;
let reports = null;   // { 종목코드: [{title, broker, date, pdf, nid}] }
let themes = [];        // [{name, total, codes, below}] — codes=30주선 위, below=아래
let belowMeta = {};     // 30주선 아래 종목 코드 → [이름, 섹터, 이격률]
                        // (data.json엔 통과 종목만 있어 below.json이 대신 싣는다)
let byCode = {};        // 종목코드 → 종목
let sortBy = "ratio", sortDesc = true;
// 섹터 화면: 크기 = 종목 수 (어느 섹터에 30주선 위 종목이 몰렸는지 = 섹터 강도)
// 종목 화면: 크기 = 시가총액. 대형주 쏠림이 심하면 sqrt 보정으로 압축(순서는 유지)
let sqrtScale = true;
const areaOf = cap => (sqrtScale ? Math.sqrt(cap) : cap);

// 종목 수가 적은 섹터는 최소 블럭으로 눌러 큰 섹터의 시각적 대비를 살린다.
const MINOR_MAX = 5;      // 이하면 최소 블럭
// 최소 블럭도 종목 수에 따라 조금씩 커지게 한다(1종목 1.25 … 5종목 2.25).
// 고정값이면 1종목과 3종목 타일이 똑같아 보여서 차이를 못 읽는다.
const MINOR_BASE = 1.0;
const MINOR_STEP = 0.25;
const minorValue = n => MINOR_BASE + n * MINOR_STEP;

const NEW_DAYS = 3;
function isNew(s) {
  if (!s.since) return false;
  const d = (Date.now() - new Date(s.since + "T00:00:00").getTime()) / 86400000;
  return d >= 0 && d < NEW_DAYS;
}

// 타일 라벨은 두 줄이라 <br>을 쓰는데, 툴팁(title)은 평문이라 줄바꿈으로 바꾼다
const stripBr = h => h.replace(/<br>/g, "\n");

// 타일 크기에 따라 정보량을 조절한다.
//   작은 타일: 비율만 / 보통: 종목수·전체·비율 / 큰 타일: NEW 개수까지
function sectorLabel(t, { compact, big } = {}) {
  const pct = t.total ? `(${(t.count / t.total * 100).toFixed(0)}%)` : "";
  if (compact) return pct || `${t.count}`;
  const base = t.total ? `${t.count}/${t.total}종목 · ${pct}` : `${t.count}종목`;
  return big && t.newCount ? `${base}<br>NEW ${t.newCount}` : base;
}

const fmt = n => n.toLocaleString("ko-KR");
const fmtMarcap = n => {
  const jo = Math.floor(n / 1e12), eok = Math.round((n % 1e12) / 1e8);
  return jo > 0 ? `${jo}조 ${fmt(eok)}억` : `${fmt(eok)}억`;
};

// 등락률 → 색. 한국식(상승 빨강/하락 파랑), ±3%에서 채도 최대
function heatColor(pct) {
  const t = Math.min(Math.abs(pct) / 3, 1);
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const flat = [74, 79, 90];
  const c = pct >= 0 ? mix(flat, [192, 57, 43]) : mix(flat, [31, 111, 208]);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* squarified treemap: 값 내림차순 items를 rect 안에 채워 위치 계산 */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (!total) return out;
  let list = items.map(d => ({ ...d, area: d.value / total * w * h }));
  const worst = (row, len) => {
    const s = row.reduce((a, b) => a + b.area, 0);
    const mx = Math.max(...row.map(r => r.area)), mn = Math.min(...row.map(r => r.area));
    return Math.max(len * len * mx / (s * s), (s * s) / (len * len * mn));
  };
  let rx = x, ry = y, rw = w, rh = h;
  while (list.length) {
    const vertical = rw >= rh;      // 짧은 변 기준으로 줄을 쌓는다
    const len = vertical ? rh : rw;
    const row = [list.shift()];
    while (list.length && worst(row, len) >= worst([...row, list[0]], len)) row.push(list.shift());
    const rowArea = row.reduce((a, b) => a + b.area, 0);
    const thick = rowArea / len;
    let off = vertical ? ry : rx;
    for (const it of row) {
      const side = it.area / thick;
      out.push(vertical
        ? { ...it, x: rx, y: off, w: thick, h: side }
        : { ...it, x: off, y: ry, w: side, h: thick });
      off += side;
    }
    if (vertical) { rx += thick; rw -= thick; } else { ry += thick; rh -= thick; }
    if (rw < 0.5 || rh < 0.5) break;
  }
  return out;
}

function setLegend(sizeLabel, showToggle) {
  document.getElementById("size-label").textContent = `타일 크기 = ${sizeLabel}`;
  document.getElementById("scale-toggle").style.display = showToggle ? "" : "none";
}

function renderTiles(items, onClick, subLabel) {
  const box = document.getElementById("heatmap");
  box.textContent = "";
  if (!items.length) {
    box.innerHTML = '<div class="empty">표시할 종목이 없습니다</div>';
    return;
  }
  const W = box.clientWidth, H = box.clientHeight;
  const sorted = [...items].sort((a, b) => b.value - a.value);
  for (const t of squarify(sorted, 0, 0, W, H)) {
    // 부동소수점 누적으로 마지막 줄이 살짝 넘칠 수 있어 컨테이너 안으로 고정
    const left = Math.max(0, t.x), top = Math.max(0, t.y);
    const w = Math.max(0, Math.min(t.w, W - left)), h = Math.max(0, Math.min(t.h, H - top));
    if (w < 1 || h < 1) continue;
    const el = document.createElement("div");
    el.className = "tile" + (t.isNew ? " tile-new" : "");
    el.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;background:${heatColor(t.pct)}`;
    const area = w * h;
    // 이름은 가장 작은 타일에도 보이게 한다. 폭이 좁으면 글자를 더 줄이고,
    // 부가 정보(종목수·등락률)는 자리가 있을 때만 덧붙인다.
    // 이름 길이까지 감안해 글자 크기를 정한다: L글자가 w폭에 줄바꿈돼 h높이 안에
    // 들어가려면 fs ≲ sqrt(w*h / (L*1.1)). 이 상한을 지켜야 이름이 안 잘린다.
    const L = Math.max(t.label.length, 1);
    const fitFs = Math.sqrt((w * h) / (L * 1.1));
    let fs = Math.max(6, Math.min(22, Math.sqrt(area) / 6, w / 3.2, fitFs));
    // 라벨은 한 줄 텍스트라 면적보다 '폭'이 관건이다. 최소 블럭은 36~51px,
    // 주요 섹터는 147px 이상으로 갈리므로 100px을 경계로 정보량을 나눈다.
    const roomy = w >= 100 && h > fs * 2.4;   // 좁으면 비율만
    const big = w >= 180 && h > fs * 4;       // 넉넉하면 NEW 개수까지
    // 좁은 타일은 비율을 이름과 같은 크기로 키운다. 두 줄이 들어가도록 살짝 줄임.
    if (!roomy) fs = Math.max(6, Math.min(fs, h / 2.7, w / 4.4));
    el.innerHTML =
      (t.isNew && area > 3000 ? `<div class="t-new">NEW</div>` : "") +
      `<div class="t-name" style="font-size:${fs}px">${t.label}</div>` +
      `<div class="t-val" style="font-size:${roomy ? Math.max(8, fs * 0.72) : fs}px">${subLabel(t, { compact: !roomy, big })}</div>`;
    el.title = `${t.label}\n${stripBr(subLabel(t))}\n시가총액 ${fmtMarcap(t.cap)}`;
    el.addEventListener("click", () => onClick(t));
    box.appendChild(el);
  }
}

// push=true일 때만 히스토리에 기록한다. 리사이즈·popstate 재렌더는 기록하면 안 된다.
// 테마별 집계 — 히트맵과 순위 목록이 같은 수치를 쓰도록 한 곳에서 만든다
function themeStats() {
  return themes.map(t => {
    const list = t.codes.map(c => byCode[c]).filter(Boolean);
    const cap = list.reduce((a, s) => a + s.marcap, 0);
    const wsum = list.reduce((a, s) => a + s.change_pct * s.marcap, 0);
    return {
      label: t.name, value: list.length, cap,
      pct: cap ? wsum / cap : 0, count: list.length,
      newCount: list.filter(isNew).length, total: t.total, key: t.name,
      ratio: t.total ? list.length / t.total : 0,
    };
  });
}

function showList(push = false) {
  currentSector = null;
  if (push) history.pushState({ sector: null }, "", location.pathname);
  document.getElementById("theme-panel").style.display = "";
  document.getElementById("controls").style.display = "";
  document.getElementById("heatmap").style.display = "none";
  document.querySelector(".legend").style.display = "none";
  document.getElementById("below-box").style.display = "none";

  const cmp = {
    name: (a, b) => a.label.localeCompare(b.label, "ko"),
    ratio: (a, b) => a.ratio - b.ratio || a.count - b.count,
    count: (a, b) => a.count - b.count,
    new: (a, b) => a.newCount - b.newCount || a.ratio - b.ratio,
  }[sortBy];
  const q = document.getElementById("search").value.trim().toLowerCase();
  const all = themeStats();
  // 검색은 정렬·순위와 무관하게 이름만 걸러낸다(순번은 걸러진 목록 기준으로 다시 매긴다)
  const rows = (q ? all.filter(r => r.label.toLowerCase().includes(q)) : all)
    .sort((a, b) => (sortDesc ? -cmp(a, b) : cmp(a, b)));

  document.querySelectorAll(".tl-head .arrow").forEach(el => (el.textContent = ""));
  const ar = document.getElementById("ar-" + sortBy);
  if (ar) ar.textContent = sortDesc ? "▼" : "▲";

  document.getElementById("crumb").innerHTML =
    `<span class="cur">테마 순위</span><span class="cnt">` +
    (q ? `"${esc(q)}" 검색 ${rows.length}개 / 전체 ${all.length}개` : `${rows.length}개`) +
    ` · 막대 = 30주선 위 비율(0~100%) · 한 종목이 여러 테마에 중복 소속됨</span>`;
  if (!rows.length) {
    document.getElementById("theme-list").innerHTML =
      '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  document.getElementById("theme-list").innerHTML = rows.map((r, i) => `
    <div class="tl-row" data-theme="${escAttr(r.label)}">
      <div class="tl-rank">${i + 1}</div>
      <div class="tl-name">${esc(r.label)}</div>
      <div class="tl-bar"><i style="width:${(r.ratio * 100).toFixed(1)}%"></i></div>
      <div class="tl-num"><b>${(r.ratio * 100).toFixed(0)}%</b> ${r.count}/${r.total}</div>
      <div class="tl-new">${r.newCount ? `<span>NEW ${r.newCount}</span>` : ""}</div>
    </div>`).join("");
}

// 히트맵 진입점은 남기되 목록으로 위임 (뒤로가기·리사이즈 경로가 이걸 부른다)
const showSectors = showList;

function showSector(name, push = false) {
  currentSector = name;
  if (push) history.pushState({ sector: name }, "", `?theme=${encodeURIComponent(name)}`);
  document.getElementById("controls").style.display = "none";
  const theme = themes.find(t => t.name === name);
  const list = (theme ? theme.codes.map(c => byCode[c]).filter(Boolean) : []);
  const items = list.map(s => ({
    label: s.name, value: areaOf(s.marcap), cap: s.marcap,
    pct: s.change_pct, code: s.code, isNew: isNew(s),
  }));
  const newCount = items.filter(i => i.isNew).length;
  const crumb = document.getElementById("crumb");
  crumb.innerHTML = `<button id="back">← 전체</button><span class="cur">${name}</span>` +
    `<span class="cnt">${sectorLabel({ count: list.length, total: theme ? theme.total : 0 })}` +
    `${newCount ? ` · 최근 진입 ${newCount}` : ""}</span>`;
  crumb.querySelector("#back").addEventListener("click", () => showList(true));
  setLegend("시가총액", true);
  document.getElementById("theme-panel").style.display = "none";
  document.getElementById("heatmap").style.display = "";
  document.querySelector(".legend").style.display = "";
  document.getElementById("heatmap").classList.remove("sector-view");
  renderTiles(items, t => openChart(stocks.find(s => s.code === t.code)),
              t => `${t.pct >= 0 ? "+" : ""}${t.pct.toFixed(2)}%`);
  renderBelow(theme);
}

// 히트맵 아래에 그 테마의 30주선 미달 종목을 나열한다. 이 종목들은 스크리닝을
// 통과하지 못해 시세·차트가 없으므로 이름만 보여준다(가나다순).
function renderBelow(theme) {
  const box = document.getElementById("below-box");
  const codes = (theme && theme.below) || [];
  if (!codes.length) { box.style.display = "none"; return; }
  // 30주선에 가까운 순(이격률 내림차순). -3%가 -45%보다 먼저 온다.
  // 곧 돌파할 수 있는 종목이 앞에 오는 게 목록을 보는 이유다.
  const rows = codes.map(c => belowStock(c))
    .sort((a, b) => b.gap_pct - a.gap_pct);
  document.getElementById("below-n").textContent = rows.length;
  // 상장 30주 미만(신규상장)이거나 스크리닝 대상이 아닌(ETF·스팩) 구성종목은
  // 위/아래를 판정할 수 없어 어느 쪽에도 안 잡힌다. 숫자가 안 맞는 이유를 밝힌다.
  const missing = theme.total - theme.codes.length - rows.length;
  document.getElementById("below-note").textContent =
    missing > 0 ? ` · 데이터 부족 ${missing}종목 제외` : "";
  document.getElementById("below-list").innerHTML = rows.map(r =>
    `<button type="button" data-code="${r.code}">${esc(r.name)}` +
    `<i>${r.gap_pct.toFixed(1)}%</i></button>`).join("");
  box.style.display = "";
}

// 미달 종목도 차트·리포트를 만들어 두었으므로 통과 종목과 같은 모달을 연다.
// 모달이 쓰는 필드(name/code/sector/gap_pct)만 themes.json의 meta로 채운다.
function belowStock(code) {
  const m = belowMeta[code] || [code, "-", 0];
  return { code, name: m[0], sector: m[1], gap_pct: m[2] };
}

document.getElementById("below-list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-code]");
  if (btn) openChart(belowStock(btn.dataset.code));
});

// ── 차트 모달 ──
const modal = document.getElementById("modal");
let chart = null;

// 차트 JSON은 용량 때문에 압축 형식이다(종목당 22.7KB → 6.5KB). 30주선 아래
// 종목까지 차트를 만들면 파일이 2,450개라 원래 형식으로는 53MB가 된다.
//   t0: 첫 봉 날짜, d: t0로부터 며칠 뒤인지, c: [시,고,저,종,거래량], m: 30주선
// 예전 형식({candles, ma30})으로 받은 파일도 그대로 통한다.
function expandChart(d) {
  if (d.candles) return d;                       // 구 형식
  const t0 = Date.parse(d.t0 + "T00:00:00Z"), DAY = 86400000;
  const candles = d.d.map((off, i) => {
    const c = d.c[i];
    return {
      time: new Date(t0 + off * DAY).toISOString().slice(0, 10),
      open: c[0], high: c[1], low: c[2], close: c[3], volume: c[4],
    };
  });
  const ma30 = [];
  d.m.forEach((v, i) => { if (v != null) ma30.push({ time: candles[i].time, value: v }); });
  return { candles, ma30 };
}

function themeColors() {
  const css = getComputedStyle(document.documentElement);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  return {
    bg: css.getPropertyValue("--card").trim(),
    text: css.getPropertyValue("--muted").trim(),
    grid: dark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.06)",
  };
}

const escAttr = t => String(t).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const esc = t => String(t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

// 증권사 리포트 목록. PDF가 있으면 원문으로, 없으면 네이버 상세 페이지로 연결.
function renderReports(code) {
  const list = document.getElementById("report-list");
  const cnt = document.getElementById("rp-count");
  if (!reports) {
    cnt.textContent = "";
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">리포트 정보를 불러오는 중…</div>';
    return;
  }
  const items = reports[code] || [];
  cnt.textContent = items.length ? `${items.length}건` : "";
  if (!items.length) {
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">등록된 리포트가 없습니다.<br>증권사 리포트는 주로 대형·중형주에 나옵니다.</div>';
    return;
  }
  list.innerHTML = items.map(r => {
    const href = r.pdf || `https://finance.naver.com/research/company_read.naver?nid=${r.nid}`;
    return `<a class="rp-item" href="${esc(href)}" target="_blank" rel="noopener">
      <div class="rp-title">${esc(r.title)}</div>
      <div class="rp-meta">${esc(r.broker)} · ${esc(r.date)}${r.pdf ? ' · <span class="rp-pdf">PDF</span>' : ""}</div>
    </a>`;
  }).join("");
  list.scrollTop = 0;
  capListHeight(list);
}

// 목록은 10개까지만 보이고 나머지는 스크롤. 제목 길이에 따라 항목 높이가 달라
// 고정 px 대신 10번째 항목의 실제 위치로 높이를 잡는다.
const REPORT_VISIBLE = 10;
function capListHeight(list) {
  list.style.maxHeight = "";
  const items = list.querySelectorAll(".rp-item");
  if (items.length <= REPORT_VISIBLE) return;   // 적으면 제한 없이 그대로
  const cs = getComputedStyle(list);   // 목록 위아래 여백을 더해야 마지막 항목이 안 잘린다
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const fit = () => {
    const it = list.querySelectorAll(".rp-item");
    return Math.ceil(it[REPORT_VISIBLE - 1].getBoundingClientRect().bottom
                     - it[0].getBoundingClientRect().top + pad);
  };
  // 높이를 줄이면 스크롤바가 생겨 폭이 좁아지고 제목이 다시 줄바꿈돼 항목이 커진다.
  // 그래서 한 번 적용한 뒤 다시 재서 맞춘다.
  list.style.maxHeight = fit() + "px";
  list.style.maxHeight = fit() + "px";
}

function openChart(s) {
  if (!s) return;
  document.getElementById("m-name").textContent = s.name;
  document.getElementById("m-code").textContent = `${s.code} · ${s.sector}`;
  // 30주선 아래 종목(테마 화면)은 이격률이 음수라 부호와 색을 나눈다
  const gap = document.getElementById("m-gap");
  gap.textContent = `30주선 ${s.gap_pct >= 0 ? "+" : ""}${s.gap_pct.toFixed(1)}%`;
  gap.classList.toggle("down", s.gap_pct < 0);
  document.getElementById("m-naver").href = `https://finance.naver.com/item/main.naver?code=${s.code}`;
  modal.classList.add("open");
  renderReports(s.code);   // 모달이 보인 뒤라야 목록 높이를 잴 수 있다

  const box = document.getElementById("chart-box");
  if (chart) { chart.remove(); chart = null; }
  box.textContent = "";

  fetch(`charts/${s.code}.json?v=${encodeURIComponent(dataVersion)}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(raw => {
      const d = expandChart(raw);
      if (!modal.classList.contains("open")) return;
      const c = themeColors();
      chart = LightweightCharts.createChart(box, {
        layout: { background: { color: c.bg }, textColor: c.text },
        grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
        // 국내 주가는 '1,645,000'처럼 자릿수가 길어 기본 축 폭에서 잘린다
        rightPriceScale: { borderVisible: false, minimumWidth: 76 },
        timeScale: { borderVisible: false },
        localization: { locale: "ko-KR", priceFormatter: p => p.toLocaleString("ko-KR") },
      });
      chart.addCandlestickSeries({
        upColor: "#e5484d", wickUpColor: "#e5484d", borderUpColor: "#e5484d",
        downColor: "#3b82f6", wickDownColor: "#3b82f6", borderDownColor: "#3b82f6",
        // 거래량 자리를 비우느라 축이 0 아래까지 내려가는 것을 막는다
        autoscaleInfoProvider: orig => {
          const r = orig();
          if (r && r.priceRange) r.priceRange.minValue = Math.max(0, r.priceRange.minValue);
          return r;
        },
      }).setData(d.candles);
      chart.addHistogramSeries({
        priceFormat: { type: "volume" }, priceScaleId: "vol",
        lastValueVisible: false, priceLineVisible: false,
      }).setData(d.candles.map(c2 => ({
        time: c2.time, value: c2.volume || 0,
        color: c2.close >= c2.open ? "rgba(229,72,77,0.4)" : "rgba(59,130,246,0.4)",
      })));
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 }, visible: false });
      chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });
      chart.addLineSeries({
        color: "#f59e0b", lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      }).setData(d.ma30);
      const from = d.candles[Math.max(0, d.candles.length - 52)].time;
      chart.timeScale().setVisibleRange({ from, to: d.candles[d.candles.length - 1].time });
    })
    .catch(() => { box.innerHTML = '<div class="empty">차트 데이터를 불러오지 못했습니다</div>'; });
}

function closeChart() {
  modal.classList.remove("open");
  if (chart) { chart.remove(); chart = null; }
}
document.getElementById("m-close").addEventListener("click", closeChart);
modal.addEventListener("click", e => { if (e.target === modal) closeChart(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChart(); });

document.getElementById("search").addEventListener("input", () => {
  if (!currentSector) showList();
});
document.getElementById("theme-head").addEventListener("click", e => {
  const key = e.target.closest("[data-sort]")?.dataset.sort;
  if (!key) return;
  if (sortBy === key) sortDesc = !sortDesc;
  else { sortBy = key; sortDesc = key !== "name"; }   // 이름만 기본 오름차순
  showList(false);
});
document.getElementById("theme-list").addEventListener("click", e => {
  const row = e.target.closest(".tl-row");
  if (row) showSector(row.dataset.theme, true);
});

const scaleBtn = document.getElementById("scale-toggle");
scaleBtn.setAttribute("aria-pressed", "true");
scaleBtn.addEventListener("click", () => {
  sqrtScale = !sqrtScale;
  scaleBtn.setAttribute("aria-pressed", String(sqrtScale));
  scaleBtn.textContent = sqrtScale ? "보정 보기" : "실제 비중";
  currentSector ? showSector(currentSector) : showSectors();
});

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!stocks.length) return;
    currentSector ? showSector(currentSector) : showList();
    if (chart) {
      const box = document.getElementById("chart-box");
      chart.resize(box.clientWidth, box.clientHeight);
    }
  }, 150);
});

// 리포트는 부가 정보라 실패해도 페이지는 그대로 동작해야 한다
fetch("reports.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : null))
  .then(d => {
    reports = (d && d.reports) || {};
    if (modal.classList.contains("open")) {
      renderReports(document.getElementById("m-code").textContent.split(" ")[0]);
    }
  })
  .catch(() => { reports = {}; });

// 브라우저 뒤로가기: 종목 화면 → 테마 히트맵으로 돌아온다(페이지를 벗어나지 않음)
addEventListener("popstate", e => {
  if (!themes.length) return;
  closeChart();
  const name = e.state ? e.state.sector : new URLSearchParams(location.search).get("theme");
  name && themes.some(t => t.name === name) ? showSector(name) : showList();
});

// data.json(종목) + themes.json(테마 구성)을 함께 받아야 화면을 그릴 수 있다
Promise.all([
  fetch("data.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("themes.json", { cache: "no-cache" }).then(r => (r.ok ? r.json() : null)),
  fetch("below.json", { cache: "no-cache" }).then(r => (r.ok ? r.json() : null)),
])
  .then(([d, th, bl]) => {
    dataVersion = d.updated;
    stocks = d.stocks.filter(s => s.market !== "ETF");
    stocks.forEach(s => { byCode[s.code] = s; });
    themes = (th && th.themes) || [];
    belowMeta = (bl && bl.stocks) || {};
    const covered = new Set(themes.flatMap(t => t.codes));
    document.getElementById("meta").textContent =
      `기준: ${d.updated} · 30주선 위 ${fmt(covered.size)}종목이 ${themes.length}개 테마에 분포`;
    if (!themes.length) {
      document.getElementById("heatmap").innerHTML =
        '<div class="empty">테마 정보가 없습니다. 스크리닝을 다시 실행하세요.</div>';
      return;
    }
    // ?theme=... 로 들어오면 그 테마를 바로 열어 새로고침·공유에도 화면이 유지된다.
    const initial = new URLSearchParams(location.search).get("theme");
    const valid = initial && themes.some(t => t.name === initial);
    history.replaceState({ sector: valid ? initial : null }, "", location.href);
    valid ? showSector(initial) : showSectors();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "data.json을 불러오지 못했습니다.";
    document.getElementById("heatmap").innerHTML = '<div class="empty">데이터 없음</div>';
  });
</script>
</body>
</html>
