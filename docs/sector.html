<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섹터 히트맵 · 30주선 위 종목</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --text: #1a1d24; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --up: #d92c2c; --down: #3b82f6; --hover: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1c1f27; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2c3038; --accent: #60a5fa; --up: #f87171; --down: #60a5fa; --hover: #262a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5;
  }
  .wrap { max-width: 1440px; margin: 0 auto; }
  .topnav { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .topnav a {
    padding: 8px 16px; font-size: 0.92rem; font-weight: 600; text-decoration: none;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .topnav a:hover { color: var(--text); }
  .topnav a.active { color: var(--accent); border-bottom-color: var(--accent); }
  /* 데이터 업데이트 버튼. 정적 사이트라 서버가 없어, 버튼 한 번으로 스크리닝을
     돌리려면 GitHub API를 직접 부르고 토큰이 필요하다. 토큰을 이 파일에 적으면
     공개 저장소라 누구나 소스에서 꺼내 간다. 그래서 처음 한 번만 입력받아 그 사람
     브라우저에만 둔다(localStorage). 소스에도 서버에도 토큰은 없다.
     옆 글자와 크기·굵기·색을 그대로 물려받고(font/color: inherit) 밑줄로만 눌림을 알린다. */
  .meta .run-btn {
    margin-left: 8px; padding: 0; border: none; background: none;
    font: inherit; color: inherit; cursor: pointer; white-space: nowrap;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .meta .run-btn:hover { color: var(--text); }
  .meta .run-btn[disabled] { cursor: default; text-decoration: none; opacity: 0.75; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }

  .crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 34px; flex-wrap: wrap; }
  .crumb button {
    padding: 6px 12px; font-size: 0.85rem; cursor: pointer; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 7px;
  }
  .crumb button:hover { color: var(--text); }
  .crumb .cur { font-weight: 700; font-size: 1rem; }
  .crumb .cnt { color: var(--muted); font-size: 0.85rem; }

  /* 히트맵 */
  #heatmap { position: relative; width: 100%; height: 620px; background: var(--border); border-radius: 10px; overflow: hidden; }
  /* squarified treemap은 짧은 변을 기준으로 줄을 쌓는다. 그래서 컨테이너가
     가로로 길면 타일이 좌우로, 세로로 길면 위아래로 진행한다.
     PC(넓음)는 가로형, 모바일(좁음)은 세로형이 되도록 높이를 나눈다. */
  #heatmap.sector-view { height: 820px; }
  @media (max-width: 760px) {
    /* 좁은 폭에서는 타일이 세로로 길게 쌓인다. 크기 지수를 올린 만큼 작은 타일이
       눌리므로 높이를 늘려 최소 타일 높이를 35px대로 되돌린다(1360px에서는 21px). */
    #heatmap.sector-view { height: 1550px; }
  }
  .tile {
    position: absolute; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 2px; transition: filter .12s;
  }
  .tile:hover { filter: brightness(1.25); z-index: 5; }
  .tile .t-name { font-weight: 700; line-height: 1.08; word-break: break-all; }
  .tile .t-val { opacity: .9; line-height: 1.2; }
  /* 최근 3일 내 30주선 진입 종목 */
  .tile-new { outline: 2px solid #ffd400; outline-offset: -2px; }
  .tile-new::after {              /* 타일이 작아 글자를 못 넣을 때도 보이는 표식 */
    content: ""; position: absolute; top: 0; right: 0;
    border-width: 0 9px 9px 0; border-style: solid;
    border-color: transparent #ffd400 transparent transparent;
  }
  .tile .t-new {
    font-size: 8px; font-weight: 800; letter-spacing: .04em;
    background: #ffd400; color: #1a1d24; padding: 0 4px; border-radius: 3px; margin-bottom: 2px;
  }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.75rem; color: var(--muted); flex-wrap: wrap; }
  .legend i { width: 22px; height: 11px; display: inline-block; border-radius: 2px; }
  #scale-toggle {
    padding: 3px 9px; font-size: 0.72rem; cursor: pointer; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  }
  #scale-toggle:hover { color: var(--text); }
  #scale-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { #heatmap { height: 460px; } }
  /* 30주선 아래 구성종목. 히트맵은 통과 종목만 그리므로 나머지를 여기 나열한다. */
  #below-box { margin-top: 18px; }
  .below-head { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
  .below-head b { color: var(--text); }
  .below-sort { opacity: .75; }
  #below-list {
    display: flex; flex-wrap: wrap; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
  }
  #below-list button {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-size: 0.8rem; font-family: inherit; color: var(--text); cursor: pointer;
    background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  }
  #below-list button:hover { background: var(--hover); border-color: var(--accent); }
  #below-list button i { font-style: normal; font-size: 0.72rem; color: var(--down); }

  /* 차트 모달 (30Weeks 페이지와 동일) */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 1140px; overflow: hidden;
    display: flex; flex-direction: column; max-height: 92vh;
  }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-head .sub { color: var(--muted); font-size: 0.82rem; }
  .modal-head .gap-badge { color: var(--up); font-weight: 600; font-size: 0.9rem; }
  .modal-head .gap-badge.down { color: var(--down); }
  .modal-head a { margin-left: auto; color: var(--accent); font-size: 0.82rem; text-decoration: none; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 0 4px; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  /* 차트(왼쪽) + 증권사 리포트(오른쪽). 좁은 화면에서는 리포트가 차트 아래로 내려간다. */
  /* 리포트가 많은 종목(삼성전자 165건)에서도 팝업이 늘어나지 않게 body를 가두고
     목록만 안에서 스크롤시킨다 */
  .modal-body { display: flex; align-items: stretch; min-height: 0; overflow: hidden; }
  /* 리포트 목록이 길어 팝업이 커지면 차트가 위쪽에 붙어 아래 여백이 크게 남는다.
     남는 공간을 위아래로 나눠 차트를 세로 중앙에 둔다. */
  .chart-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  #chart-box { width: 100%; height: 420px; }
  .chart-hint { padding: 8px 18px 14px; color: var(--muted); font-size: 0.75rem; }
  .report-pane {
    flex: 0 0 278px; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .report-pane h3 {
    font-size: 0.85rem; padding: 12px 14px 8px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .report-pane h3 span { font-weight: 400; }
  #report-list { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding: 4px 0; }
  .rp-item {
    display: block; padding: 9px 14px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--border);
  }
  .rp-item:last-child { border-bottom: none; }
  .rp-item:hover { background: var(--hover); }
  .rp-title { font-size: 0.82rem; line-height: 1.35; margin-bottom: 3px; word-break: keep-all; }
  .rp-meta { font-size: 0.72rem; color: var(--muted); }
  .rp-pdf { color: var(--accent); }
  .rp-empty { padding: 24px 14px; text-align: center; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
  @media (max-width: 900px) {
    .modal-body { flex-direction: column; }
    .report-pane { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--border); max-height: 210px; }
  }
  @media (max-width: 640px) { #chart-box { height: 300px; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="index.html">30Weeks</a>
    <a href="sector.html" class="active">섹터 히트맵</a>
    <a href="theme.html">테마</a>
  </nav>
  <h1>섹터 히트맵</h1>
  <div class="meta" id="meta"><span id="meta-text">데이터 로딩 중...</span><button type="button" class="run-btn" id="run-btn" title="누르면 스크리닝이 시작되고 약 10분 뒤 이 사이트에 반영됩니다. 처음 한 번만 GitHub 토큰을 입력합니다(이 브라우저에만 저장).">↻ 업데이트</button></div>
  <div class="crumb" id="crumb"></div>
  <div id="heatmap"></div>
  <div class="legend">
    <span id="size-label">타일 크기 = 종목 수</span>
    <button id="scale-toggle" type="button">보정 보기</button>
    <span>·</span>
    <span>색 = 등락률</span>
    <i style="background:#1f6fd0"></i><span>하락</span>

    <i style="background:#c0392b"></i><span>상승</span>
  </div>
  <div id="below-box" style="display:none">
    <div class="below-head">30주선 아래 <b id="below-n">0</b>종목<span id="below-note"></span>
      <span class="below-sort">· 30주선에 가까운 순</span></div>
    <div id="below-list"></div>

</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="m-name"></h2>
      <span class="sub" id="m-code"></span>
      <span class="gap-badge" id="m-gap"></span>
      <a id="m-naver" href="#" target="_blank" rel="noopener">네이버 금융 ↗</a>
      <button class="modal-close" id="m-close" aria-label="닫기">×</button>
    </div>
    <div class="modal-body">
      <div class="chart-pane">
        <div id="chart-box"></div>
        <div class="chart-hint">주봉 · 주황선 = 30주 이동평균 · 하단 막대 = 거래량 · 왼쪽 회색 = 매물대(보이는 구간 기준) · 휠/핀치로 줌, 드래그로 기간 이동</div>
      </div>
      <aside class="report-pane">
        <h3>증권사 리포트 <span id="rp-count"></span></h3>
        <div id="report-list"></div>
      </aside>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
let stocks = [], dataVersion = "", currentSector = null;
let belowMeta = {};     // 30주선 아래 종목 코드 → [이름, 섹터, 이격률]
                        // (data.json엔 통과 종목만 있어 below.json이 대신 싣는다)
let reports = null;   // { 종목코드: [{title, broker, date, pdf, nid}] }
let sectorTotals = {};  // { 섹터: 그 섹터의 전체 종목 수 } — 30주선 위 비중의 분모
// 섹터 화면: 크기 = 종목 수 (어느 섹터에 30주선 위 종목이 몰렸는지 = 섹터 강도)
// 종목 화면: 크기 = 시가총액. 대형주 쏠림이 심하면 sqrt 보정으로 압축(순서는 유지)
let sqrtScale = true;
const areaOf = cap => (sqrtScale ? Math.sqrt(cap) : cap);

// 타일 넓이를 종목 수에 그대로 비례시키면 39종목과 1종목의 면적비가 31배,
// 변 길이로는 4배(237px vs 60px)뿐이라 강한 섹터가 눈에 띄지 않는다.
// 넓이를 종목 수의 1.5제곱으로 잡아 면적비를 최대한 벌린다(PC 기준 약 100배).
const SIZE_POW = 1.5;
// 지수만 쓰면 1~2종목 타일이 이름을 못 담을 만큼 뭉개진다. 바닥값이 필요한데,
// 고정 상수로 두면 컨테이너가 좁은 폰에서 26x31까지 눌려 깨진다(PC는 45x41).
// 그래서 바닥을 상수로 두지 않고 '최소 타일 면적'에서 역산한다.
const MIN_TILE_PX = 1900;   // 이름 6~8자 + 비율이 7px 글씨로 들어가는 넓이
const FLOOR_GRAD = 0.16;    // 바닥에 걸린 타일끼리도 1·2·3종목 차이가 보이게

// 바닥값 f를 올리면 전체 합도 같이 커져 각 타일 몫이 다시 줄어든다.
// 고정점이라 몇 번 반복하면 수렴한다(보통 4~5회).
function applyMinArea(items) {
  const box = document.getElementById("heatmap");
  const boxArea = box.clientWidth * box.clientHeight;
  const base = items.map(t => Math.pow(t.count, SIZE_POW));
  const valuesAt = f => items.map((t, k) => Math.max(base[k], f * (1 + FLOOR_GRAD * t.count)));
  let f = 0;
  if (boxArea) {
    const share = MIN_TILE_PX / boxArea;   // 최소 타일이 차지해야 할 넓이 비율
    for (let i = 0; i < 20; i++) {
      const vals = valuesAt(f);
      const sum = vals.reduce((a, b) => a + b, 0);
      if (Math.min(...vals) / sum >= share) break;
      f = (share * sum) / (1 + FLOOR_GRAD);
    }
  }
  const vals = valuesAt(f);
  items.forEach((t, k) => { t.value = vals[k]; });
}

// 작은 타일은 '식품과기본식료품소매'(10자) 같은 긴 이름을 통째로 담으려다
// 글자가 6px까지 눌리고, 그걸 피하려면 타일을 키워야 해서 대비가 죽는다.
// 좁은 타일에서는 이름을 잘라 글자 크기를 지키고 타일은 최소로 줄인다.
// 잘린 전체 이름은 타일 title(툴팁)에 그대로 남는다.
const NAME_CLIP_MAX = 8;   // 좁은 타일에 표시할 최대 글자 수
const NAME_CLIP_MIN = 6;   // 아주 좁아도 이만큼은 보여준다
const clipName = (name, n) => (name.length > n ? name.slice(0, n - 1) + "…" : name);

const NEW_DAYS = 3;
function isNew(s) {
  if (!s.since) return false;
  const d = (Date.now() - new Date(s.since + "T00:00:00").getTime()) / 86400000;
  return d >= 0 && d < NEW_DAYS;
}

// 타일 라벨은 두 줄이라 <br>을 쓰는데, 툴팁(title)은 평문이라 줄바꿈으로 바꾼다
const stripBr = h => h.replace(/<br>/g, "\n");

// 타일 크기에 따라 정보량을 조절한다.
//   작은 타일: 비율만 / 보통: 종목수·전체·비율 / 큰 타일: NEW 개수까지
function sectorLabel(t, { compact, big } = {}) {
  const pct = t.total ? `(${(t.count / t.total * 100).toFixed(0)}%)` : "";
  if (compact) return pct || `${t.count}`;
  const base = t.total ? `${t.count}/${t.total}종목 · ${pct}` : `${t.count}종목`;
  return big && t.newCount ? `${base}<br>NEW ${t.newCount}` : base;
}

const fmt = n => n.toLocaleString("ko-KR");
const fmtMarcap = n => {
  const jo = Math.floor(n / 1e12), eok = Math.round((n % 1e12) / 1e8);
  return jo > 0 ? `${jo}조 ${fmt(eok)}억` : `${fmt(eok)}억`;
};

// 등락률 → 색. 한국식(상승 빨강/하락 파랑), ±3%에서 채도 최대
function heatColor(pct) {
  const t = Math.min(Math.abs(pct) / 3, 1);
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const flat = [74, 79, 90];
  const c = pct >= 0 ? mix(flat, [192, 57, 43]) : mix(flat, [31, 111, 208]);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* squarified treemap: 값 내림차순 items를 rect 안에 채워 위치 계산 */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (!total) return out;
  let list = items.map(d => ({ ...d, area: d.value / total * w * h }));
  const worst = (row, len) => {
    const s = row.reduce((a, b) => a + b.area, 0);
    const mx = Math.max(...row.map(r => r.area)), mn = Math.min(...row.map(r => r.area));
    return Math.max(len * len * mx / (s * s), (s * s) / (len * len * mn));
  };
  let rx = x, ry = y, rw = w, rh = h;
  while (list.length) {
    const vertical = rw >= rh;      // 짧은 변 기준으로 줄을 쌓는다
    const len = vertical ? rh : rw;
    const row = [list.shift()];
    while (list.length && worst(row, len) >= worst([...row, list[0]], len)) row.push(list.shift());
    const rowArea = row.reduce((a, b) => a + b.area, 0);
    const thick = rowArea / len;
    let off = vertical ? ry : rx;
    for (const it of row) {
      const side = it.area / thick;
      out.push(vertical
        ? { ...it, x: rx, y: off, w: thick, h: side }
        : { ...it, x: off, y: ry, w: side, h: thick });
      off += side;
    }
    if (vertical) { rx += thick; rw -= thick; } else { ry += thick; rh -= thick; }
    if (rw < 0.5 || rh < 0.5) break;
  }
  return out;
}

function setLegend(sizeLabel, showToggle) {
  document.getElementById("size-label").textContent = `타일 크기 = ${sizeLabel}`;
  document.getElementById("scale-toggle").style.display = showToggle ? "" : "none";
}

function renderTiles(items, onClick, subLabel) {
  const box = document.getElementById("heatmap");
  box.textContent = "";
  if (!items.length) {
    box.innerHTML = '<div class="empty">표시할 종목이 없습니다</div>';
    return;
  }
  const W = box.clientWidth, H = box.clientHeight;
  const sorted = [...items].sort((a, b) => b.value - a.value);
  for (const t of squarify(sorted, 0, 0, W, H)) {
    // 부동소수점 누적으로 마지막 줄이 살짝 넘칠 수 있어 컨테이너 안으로 고정
    const left = Math.max(0, t.x), top = Math.max(0, t.y);
    const w = Math.max(0, Math.min(t.w, W - left)), h = Math.max(0, Math.min(t.h, H - top));
    if (w < 1 || h < 1) continue;
    const el = document.createElement("div");
    el.className = "tile" + (t.isNew ? " tile-new" : "");
    el.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;background:${heatColor(t.pct)}`;
    const area = w * h;
    // 이름은 가장 작은 타일에도 보이게 한다. 폭이 좁으면 글자를 더 줄이고,
    // 부가 정보(종목수·등락률)는 자리가 있을 때만 덧붙인다.
    // 이름 길이까지 감안해 글자 크기를 정한다: L글자가 w폭에 줄바꿈돼 h높이 안에
    // 들어가려면 fs ≲ sqrt(w*h / (L*1.1)). 이 상한을 지켜야 이름이 안 잘린다.
    // 좁은 타일은 이름을 최대 8자로 자른다. 글자 수가 줄면 같은 글자 크기를
    // 훨씬 작은 타일에도 담을 수 있어 최소 타일을 더 줄일 수 있다.
    const narrow = w < 100;
    const name = narrow ? clipName(t.label, NAME_CLIP_MAX) : t.label;
    const L = Math.max(name.length, 1);
    const fitFs = Math.sqrt((w * h) / (L * 1.1));
    let fs = Math.max(6, Math.min(22, Math.sqrt(area) / 6, w / 3.2, fitFs));
    // 라벨은 한 줄 텍스트라 면적보다 '폭'이 관건이다. 최소 블럭은 36~51px,
    // 주요 섹터는 147px 이상으로 갈리므로 100px을 경계로 정보량을 나눈다.
    const roomy = !narrow && h > fs * 2.4;    // 좁으면 비율만
    const big = w >= 180 && h > fs * 4;       // 넉넉하면 NEW 개수까지
    // 좁은 타일은 비율을 이름과 같은 크기로 키운다. 두 줄이 들어가도록 살짝 줄임.
    if (!roomy) fs = Math.max(6, Math.min(fs, h / 2.7, w / 4.4));
    // fs가 위에서 더 줄었을 수 있으니, 실제로 들어가는 글자 수로 한 번 더 자른다.
    // (한 줄 w/fs자 × h/(fs*1.15)줄, 마지막 줄에 비율 라벨 자리를 한 줄 비워둔다)
    let shown = name;
    if (narrow) {
      const cap = Math.floor(w / fs) * Math.max(1, Math.floor(h / (fs * 1.15)) - 1);
      shown = clipName(name, Math.min(NAME_CLIP_MAX, Math.max(NAME_CLIP_MIN, cap)));
    }
    el.innerHTML =
      (t.isNew && area > 3000 ? `<div class="t-new">NEW</div>` : "") +
      `<div class="t-name" style="font-size:${fs}px">${shown}</div>` +
      `<div class="t-val" style="font-size:${roomy ? Math.max(8, fs * 0.72) : fs}px">${subLabel(t, { compact: !roomy, big })}</div>`;
    el.title = `${t.label}\n${stripBr(subLabel(t))}\n시가총액 ${fmtMarcap(t.cap)}`;
    el.addEventListener("click", () => onClick(t));
    box.appendChild(el);
  }
}

// push=true일 때만 히스토리에 기록한다. 리사이즈·popstate 재렌더는 기록하면 안 된다.
function showSectors(push = false) {
  currentSector = null;
  if (push) history.pushState({ sector: null }, "", location.pathname);
  const bySector = {};
  for (const s of stocks) {
    const b = bySector[s.sector] || (bySector[s.sector] = { cap: 0, wsum: 0, n: 0, nw: 0 });
    b.cap += s.marcap; b.wsum += s.change_pct * s.marcap; b.n++;
    if (isNew(s)) b.nw++;
  }
  // 크기 = 종목 수. 시총으로 하면 반도체가 78%를 먹어 섹터 강도를 못 읽는다.
  const items = Object.entries(bySector).map(([name, b]) => ({
    label: name, value: 0, cap: b.cap,
    pct: b.cap ? b.wsum / b.cap : 0, count: b.n, newCount: b.nw,
    total: sectorTotals[name] || 0, key: name,
  }));
  document.getElementById("crumb").innerHTML =
    `<span class="cur">전체 섹터</span><span class="cnt">${items.length}개 · `
    + `${sectorLabel({ count: stocks.length, total: Object.values(sectorTotals).reduce((a, b) => a + b, 0) })}</span>`;
  setLegend("종목 수", false);
  document.getElementById("below-box").style.display = "none";
  document.getElementById("heatmap").classList.add("sector-view");
  applyMinArea(items);   // 컨테이너 크기를 읽어야 하므로 sector-view를 붙인 뒤에
  renderTiles(items, t => showSector(t.key, true), sectorLabel);
}

function showSector(name, push = false) {
  currentSector = name;
  if (push) history.pushState({ sector: name }, "", `?sector=${encodeURIComponent(name)}`);
  const list = stocks.filter(s => s.sector === name);
  const items = list.map(s => ({
    label: s.name, value: areaOf(s.marcap), cap: s.marcap,
    pct: s.change_pct, code: s.code, isNew: isNew(s),
  }));
  const newCount = items.filter(i => i.isNew).length;
  const crumb = document.getElementById("crumb");
  crumb.innerHTML = `<button id="back">← 전체</button><span class="cur">${name}</span>` +
    `<span class="cnt">${sectorLabel({ count: list.length, total: sectorTotals[name] || 0 })}` +
    `${newCount ? ` · 최근 진입 ${newCount}` : ""}</span>`;
  crumb.querySelector("#back").addEventListener("click", () => showSectors(true));
  setLegend("시가총액", true);
  document.getElementById("heatmap").classList.remove("sector-view");
  renderTiles(items, t => openChart(stocks.find(s => s.code === t.code)),
              t => `${t.pct >= 0 ? "+" : ""}${t.pct.toFixed(2)}%`);
  renderBelow(name, list.length);
}

// 히트맵 아래에 그 섹터의 30주선 미달 종목을 나열한다(가나다순).
// 미달 종목도 차트·리포트를 만들어 두었으므로 통과 종목과 같은 모달을 연다.
function renderBelow(sector, hit) {
  const box = document.getElementById("below-box");
  // 30주선에 가까운 순(이격률 내림차순). -3%가 -45%보다 먼저 온다.
  // 곧 돌파할 수 있는 종목이 앞에 오는 게 목록을 보는 이유다.
  const rows = Object.keys(belowMeta)
    .filter(c => belowMeta[c][1] === sector)
    .map(belowStock)
    .sort((a, b) => b.gap_pct - a.gap_pct);
  if (!rows.length) { box.style.display = "none"; return; }
  document.getElementById("below-n").textContent = rows.length;
  // 상장 30주 미만(신규상장)이거나 데이터를 못 받은 종목은 위/아래 어느 쪽에도
  // 안 잡힌다. 분모와 숫자가 안 맞는 이유를 밝힌다.
  const missing = (sectorTotals[sector] || 0) - hit - rows.length;
  document.getElementById("below-note").textContent =
    missing > 0 ? ` · 데이터 부족 ${missing}종목 제외` : "";
  document.getElementById("below-list").innerHTML = rows.map(r =>
    `<button type="button" data-code="${r.code}">${esc(r.name)}` +
    `<i>${r.gap_pct.toFixed(1)}%</i></button>`).join("");
  box.style.display = "";
}

// 모달이 쓰는 필드(name/code/sector/gap_pct)만 below.json으로 채운다
function belowStock(code) {
  const m = belowMeta[code] || [code, "-", 0];
  return { code, name: m[0], sector: m[1], gap_pct: m[2] };
}

document.getElementById("below-list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-code]");
  if (btn) openChart(belowStock(btn.dataset.code));
});

// ── 차트 모달 ──
const modal = document.getElementById("modal");
let chart = null;

// 차트 JSON은 용량 때문에 압축 형식이다(종목당 22.7KB → 6.5KB). 30주선 아래
// 종목까지 차트를 만들면 파일이 2,450개라 원래 형식으로는 53MB가 된다.
//   t0: 첫 봉 날짜, d: t0로부터 며칠 뒤인지, c: [시,고,저,종,거래량], m: 30주선
// 예전 형식({candles, ma30})으로 받은 파일도 그대로 통한다.
function expandChart(d) {
  if (d.candles) return d;                       // 구 형식
  const t0 = Date.parse(d.t0 + "T00:00:00Z"), DAY = 86400000;
  const candles = d.d.map((off, i) => {
    const c = d.c[i];
    return {
      time: new Date(t0 + off * DAY).toISOString().slice(0, 10),
      open: c[0], high: c[1], low: c[2], close: c[3], volume: c[4],
    };
  });
  const ma30 = [];
  d.m.forEach((v, i) => { if (v != null) ma30.push({ time: candles[i].time, value: v }); });
  return { candles, ma30 };
}

// ── 매물대(Volume Profile) ──────────────────────────────────────────────
// Lightweight Charts v4에는 매물대 시리즈가 없다. 차트 위에 캔버스를 덧대고
// series.priceToCoordinate()로 가격→화면좌표를 받아 직접 그린다.
//
// 화면에 보이는 구간만 다시 계산한다. 그래서 서버에서 미리 구운 고정 버킷을 쓸 수
// 없고 브라우저가 매번 센다. 재료는 이미 로드된 주봉이다. 일봉을 쓰면 더 정확하지만
// (일봉 대비 상관 0.958, 최대 매물대 오차 평균 2.1%) 차트 파일이 8.7KB에서 18KB로
// 늘어 전체 12MB가 33MB가 된다. 그 값을 치를 만큼의 차이가 아니라 주봉으로 센다.
//
// 봉 안에서 거래량이 어느 가격에 몰렸는지는 알 수 없어 [저가, 고가]에 균등 배분한다.
// HTS의 체결가별 매물대와는 다른 근사치다.
const VP_BUCKETS = 24;
const VP_WIDTH = 0.82;      // 최대 매물대 길이 = 그림 영역 폭의 82%
let vpCanvas = null, vpSeries = null, vpBars = null, vpPending = false;

function vpProfile(bars) {
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { if (b.low < lo) lo = b.low; if (b.high > hi) hi = b.high; }
  if (!isFinite(lo) || hi <= lo) return null;
  const step = (hi - lo) / VP_BUCKETS;
  const bins = new Array(VP_BUCKETS).fill(0);
  for (const b of bars) {
    const a = Math.max(0, Math.min(VP_BUCKETS - 1, Math.floor((b.low - lo) / step)));
    const z = Math.max(0, Math.min(VP_BUCKETS - 1, Math.floor((b.high - lo) / step)));
    const share = (b.volume || 0) / (z - a + 1);
    for (let i = a; i <= z; i++) bins[i] += share;
  }
  const max = Math.max(...bins);
  return max > 0 ? { lo, step, bins, max } : null;
}

function vpDraw() {
  vpPending = false;
  if (!chart || !vpCanvas || !vpSeries || !vpBars) return;
  const box = document.getElementById("chart-box");
  const w = box.clientWidth, h = box.clientHeight, dpr = window.devicePixelRatio || 1;
  if (vpCanvas.width !== Math.round(w * dpr) || vpCanvas.height !== Math.round(h * dpr)) {
    vpCanvas.width = Math.round(w * dpr); vpCanvas.height = Math.round(h * dpr);
    vpCanvas.style.width = w + "px"; vpCanvas.style.height = h + "px";
  }
  const g = vpCanvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  // 화면에 보이는 봉만 골라 센다
  const r = chart.timeScale().getVisibleLogicalRange();
  if (!r) return;
  const a = Math.max(0, Math.ceil(r.from)), z = Math.min(vpBars.length - 1, Math.floor(r.to));
  if (z < a) return;
  const p = vpProfile(vpBars.slice(a, z + 1));
  if (!p) return;

  const plotW = chart.timeScale().width();
  const maxBar = plotW * VP_WIDTH;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  g.fillStyle = dark ? "rgba(148,163,184,0.30)" : "rgba(100,116,139,0.22)";
  for (let i = 0; i < p.bins.length; i++) {
    const yTop = vpSeries.priceToCoordinate(p.lo + (i + 1) * p.step);
    const yBot = vpSeries.priceToCoordinate(p.lo + i * p.step);
    if (yTop == null || yBot == null) continue;
    const bh = yBot - yTop;
    if (bh <= 0) continue;
    const bw = (p.bins[i] / p.max) * maxBar;
    if (bw < 0.5) continue;
    g.fillRect(0, yTop, bw, Math.max(1, bh - 1));   // 왼쪽 끝에서 오른쪽으로
  }
}

// 확대·이동 중에는 프레임당 한 번만 다시 그린다. 백그라운드 탭에서는 rAF가 아예
// 안 돌아 매물대가 갱신되지 않으므로 타이머로 한 번 더 받쳐둔다(rAF가 돌면 무시된다).
const vpSchedule = () => {
  if (vpPending) return;
  vpPending = true;
  requestAnimationFrame(vpDraw);
  setTimeout(() => { if (vpPending) vpDraw(); }, 100);
};

function vpAttach(series, bars) {
  const box = document.getElementById("chart-box");
  vpSeries = series; vpBars = bars;
  vpCanvas = document.createElement("canvas");
  // 캔들 아래로 깔면 가려져서 위에 올리되, 반투명이라 캔들이 비쳐 보인다
  vpCanvas.style.cssText = "position:absolute;left:0;top:0;z-index:2;pointer-events:none";
  box.style.position = "relative";
  box.appendChild(vpCanvas);
  chart.timeScale().subscribeVisibleLogicalRangeChange(vpSchedule);
  // 붙인 직후에는 차트 레이아웃이 아직 안 잡혀 getVisibleLogicalRange()가 null이라
  // 첫 프레임이 그냥 반환된다. 초기 구간 설정이 구독을 깨우지만, 그마저 놓치는
  // 경우를 대비해 한 번 더 예약한다.
  // 첫 렌더는 rAF를 거치지 않고 직접 부른다. 탭이 백그라운드면 rAF가 아예 안 돌아
  // 매물대가 영영 안 그려진다(실제로 그 상태를 재현해 확인했다).
  setTimeout(vpDraw, 60);   // 첫 렌더는 rAF를 안 거친다(백그라운드 탭 대비)
}

function vpDetach() {
  if (vpCanvas && vpCanvas.parentNode) vpCanvas.parentNode.removeChild(vpCanvas);
  vpCanvas = null; vpSeries = null; vpBars = null;
}

// ── 데이터 업데이트 버튼 ──────────────────────────────────────────────────
// 토큰은 fine-grained로 이 저장소 하나에 Actions: Read and write 만 줘야 한다.
// 그러면 유출돼도 이 저장소의 워크플로를 돌리는 것 외에는 아무것도 못 한다.
const RUN_REPO = "82imgrowth/stock-screener-30w";
const RUN_WF = "screen.yml";
const RUN_KEY = "gh-dispatch-token";
const RUN_LABEL = "↻ 업데이트";

const runStore = {
  get() { try { return localStorage.getItem(RUN_KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(RUN_KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(RUN_KEY); } catch (e) {} },
};

function askToken() {
  const t = prompt(
    "GitHub 토큰을 붙여넣으세요.\n" +
    "이 브라우저에만 저장되며 사이트 소스에는 남지 않습니다.\n\n" +
    "발급 (github.com/settings/personal-access-tokens):\n" +
    "  1. Generate new token\n" +
    "  2. Repository access → Only select repositories → " + RUN_REPO + "\n" +
    "  3. Permissions → Actions → Read and write"
  );
  if (!t || !t.trim()) return null;
  const v = t.trim();
  runStore.set(v);
  return v;
}

function runLabel(btn, text, busy) {
  btn.textContent = text;
  btn.disabled = !!busy;
}

// 이미 돌고 있으면 새로 걸지 않는다. GitHub의 concurrency는 줄 세우기(대기) 아니면
// 앞엣것 취소만 되고 '새 요청 버리기'가 없어서, 여기서 막는다. 다른 탭·다른 기기에서
// 눌렀거나 새로고침해 버튼 상태가 초기화된 경우까지 걸러진다.
async function runBusy(token) {
  try {
    const r = await fetch(
      "https://api.github.com/repos/" + RUN_REPO + "/actions/workflows/" + RUN_WF + "/runs?per_page=5",
      { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } }
    );
    if (!r.ok) return false;   // 확인 못 하면 막지 않는다 — 못 돌리는 쪽이 더 나쁘다
    const j = await r.json();
    const busy = ["queued", "in_progress", "waiting", "requested", "pending"];
    return (j.workflow_runs || []).some(x => busy.indexOf(x.status) >= 0);
  } catch (e) {
    return false;
  }
}

async function runUpdate() {
  const btn = document.getElementById("run-btn");
  const token = runStore.get() || askToken();
  if (!token) return;

  runLabel(btn, "확인 중…", true);
  if (await runBusy(token)) {
    alert("이미 실행 중입니다.\n끝날 때까지 기다려 주세요. 진행 상황은 버튼에 표시됩니다.");
    runWatch(btn);   // 새로 걸지는 않고 진행만 지켜본다
    return;
  }

  runLabel(btn, "요청 중…", true);
  let res;
  try {
    res = await fetch(
      "https://api.github.com/repos/" + RUN_REPO + "/actions/workflows/" + RUN_WF + "/dispatches",
      {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        },
        body: JSON.stringify({ ref: "main" }),
      }
    );
  } catch (e) {
    runLabel(btn, RUN_LABEL, false);
    alert("네트워크 오류로 요청하지 못했습니다.\n" + e.message);
    return;
  }

  // 404도 사실상 권한 문제다 — 권한 없는 토큰에는 저장소가 없는 것처럼 보인다.
  if (res.status === 401 || res.status === 403 || res.status === 404) {
    runStore.clear();
    runLabel(btn, RUN_LABEL, false);
    alert(
      "토큰이 거부됐습니다 (" + res.status + "). 저장된 토큰을 지웠습니다.\n\n" +
      "확인할 것:\n" +
      "  · Repository access 에 " + RUN_REPO + " 가 포함됐는지\n" +
      "  · Permissions → Actions 가 Read and write 인지\n" +
      "  · 토큰이 만료되지 않았는지"
    );
    return;
  }
  if (res.status !== 204) {
    runLabel(btn, RUN_LABEL, false);
    alert("실행 요청이 실패했습니다 (" + res.status + " " + res.statusText + ")");
    return;
  }
  runWatch(btn);
}

// 스크리닝 5~9분 + Pages 빌드 2~3분. '실행이 끝났다'가 아니라 '사이트에 반영됐다'를
// 봐야 하므로, 워크플로 상태가 아니라 data.json의 갱신 시각이 바뀌는지를 지켜본다.
function runWatch(btn) {
  const t0 = Date.now();
  const was = dataVersion;
  const tick = async () => {
    if (Date.now() - t0 > 20 * 60000) {
      runLabel(btn, "확인 필요 · 새로고침", false);
      return;
    }
    runLabel(btn, "실행 중… " + Math.floor((Date.now() - t0) / 60000) + "분", true);
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      const d = await r.json();
      if (d.updated && d.updated !== was) {
        runLabel(btn, "완료 · 새로고침", false);
        btn.onclick = () => location.reload();
        return;
      }
    } catch (e) {}
    setTimeout(tick, 20000);
  };
  tick();
}

document.getElementById("run-btn").addEventListener("click", runUpdate);

function themeColors() {
  const css = getComputedStyle(document.documentElement);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  return {
    bg: css.getPropertyValue("--card").trim(),
    text: css.getPropertyValue("--muted").trim(),
    grid: dark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.06)",
  };
}

const esc = t => String(t).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

// 증권사 리포트 목록. PDF가 있으면 원문으로, 없으면 네이버 상세 페이지로 연결.
function renderReports(code) {
  const list = document.getElementById("report-list");
  const cnt = document.getElementById("rp-count");
  if (!reports) {
    cnt.textContent = "";
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">리포트 정보를 불러오는 중…</div>';
    return;
  }
  const items = reports[code] || [];
  cnt.textContent = items.length ? `${items.length}건` : "";
  if (!items.length) {
    list.style.maxHeight = "";
    list.innerHTML = '<div class="rp-empty">등록된 리포트가 없습니다.<br>증권사 리포트는 주로 대형·중형주에 나옵니다.</div>';
    return;
  }
  list.innerHTML = items.map(r => {
    const href = r.pdf || `https://finance.naver.com/research/company_read.naver?nid=${r.nid}`;
    return `<a class="rp-item" href="${esc(href)}" target="_blank" rel="noopener">
      <div class="rp-title">${esc(r.title)}</div>
      <div class="rp-meta">${esc(r.broker)} · ${esc(r.date)}${r.pdf ? ' · <span class="rp-pdf">PDF</span>' : ""}</div>
    </a>`;
  }).join("");
  list.scrollTop = 0;
  capListHeight(list);
}

// 목록은 10개까지만 보이고 나머지는 스크롤. 제목 길이에 따라 항목 높이가 달라
// 고정 px 대신 10번째 항목의 실제 위치로 높이를 잡는다.
const REPORT_VISIBLE = 10;
function capListHeight(list) {
  list.style.maxHeight = "";
  const items = list.querySelectorAll(".rp-item");
  if (items.length <= REPORT_VISIBLE) return;   // 적으면 제한 없이 그대로
  const cs = getComputedStyle(list);   // 목록 위아래 여백을 더해야 마지막 항목이 안 잘린다
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const fit = () => {
    const it = list.querySelectorAll(".rp-item");
    return Math.ceil(it[REPORT_VISIBLE - 1].getBoundingClientRect().bottom
                     - it[0].getBoundingClientRect().top + pad);
  };
  // 높이를 줄이면 스크롤바가 생겨 폭이 좁아지고 제목이 다시 줄바꿈돼 항목이 커진다.
  // 그래서 한 번 적용한 뒤 다시 재서 맞춘다.
  list.style.maxHeight = fit() + "px";
  list.style.maxHeight = fit() + "px";
}

function openChart(s) {
  if (!s) return;
  document.getElementById("m-name").textContent = s.name;
  document.getElementById("m-code").textContent = `${s.code} · ${s.sector}`;
  // 30주선 아래 종목(테마 화면)은 이격률이 음수라 부호와 색을 나눈다
  const gap = document.getElementById("m-gap");
  gap.textContent = `30주선 ${s.gap_pct >= 0 ? "+" : ""}${s.gap_pct.toFixed(1)}%`;
  gap.classList.toggle("down", s.gap_pct < 0);
  document.getElementById("m-naver").href = `https://finance.naver.com/item/main.naver?code=${s.code}`;
  modal.classList.add("open");
  renderReports(s.code);   // 모달이 보인 뒤라야 목록 높이를 잴 수 있다

  const box = document.getElementById("chart-box");
  if (chart) { chart.remove(); chart = null; }
  box.textContent = "";

  fetch(`charts/${s.code}.json?v=${encodeURIComponent(dataVersion)}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(raw => {
      const d = expandChart(raw);
      if (!modal.classList.contains("open")) return;
      const c = themeColors();
      chart = LightweightCharts.createChart(box, {
        layout: { background: { color: c.bg }, textColor: c.text },
        grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
        // 국내 주가는 '1,645,000'처럼 자릿수가 길어 기본 축 폭에서 잘린다
        rightPriceScale: { borderVisible: false, minimumWidth: 76 },
        timeScale: { borderVisible: false },
        localization: { locale: "ko-KR", priceFormatter: p => p.toLocaleString("ko-KR") },
      });
      const candleSeries = chart.addCandlestickSeries({
        upColor: "#e5484d", wickUpColor: "#e5484d", borderUpColor: "#e5484d",
        downColor: "#3b82f6", wickDownColor: "#3b82f6", borderDownColor: "#3b82f6",
        // 거래량 자리를 비우느라 축이 0 아래까지 내려가는 것을 막는다
        autoscaleInfoProvider: orig => {
          const r = orig();
          if (r && r.priceRange) r.priceRange.minValue = Math.max(0, r.priceRange.minValue);
          return r;
        },
      });
      candleSeries.setData(d.candles);
      chart.addHistogramSeries({
        priceFormat: { type: "volume" }, priceScaleId: "vol",
        lastValueVisible: false, priceLineVisible: false,
      }).setData(d.candles.map(c2 => ({
        time: c2.time, value: c2.volume || 0,
        color: c2.close >= c2.open ? "rgba(229,72,77,0.4)" : "rgba(59,130,246,0.4)",
      })));
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 }, visible: false });
      chart.priceScale("right").applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });
      chart.addLineSeries({
        color: "#f59e0b", lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      }).setData(d.ma30);
      const from = d.candles[Math.max(0, d.candles.length - 52)].time;
      vpAttach(candleSeries, d.candles);   // 구독을 먼저 걸어야 아래 구간 설정을 잡는다
      chart.timeScale().setVisibleRange({ from, to: d.candles[d.candles.length - 1].time });
    })
    .catch(() => { box.innerHTML = '<div class="empty">차트 데이터를 불러오지 못했습니다</div>'; });
}

function closeChart() {
  modal.classList.remove("open");
  vpDetach();
  if (chart) { chart.remove(); chart = null; }
}
document.getElementById("m-close").addEventListener("click", closeChart);
modal.addEventListener("click", e => { if (e.target === modal) closeChart(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChart(); });

const scaleBtn = document.getElementById("scale-toggle");
scaleBtn.setAttribute("aria-pressed", "true");
scaleBtn.addEventListener("click", () => {
  sqrtScale = !sqrtScale;
  scaleBtn.setAttribute("aria-pressed", String(sqrtScale));
  scaleBtn.textContent = sqrtScale ? "보정 보기" : "실제 비중";
  currentSector ? showSector(currentSector) : showSectors();
});

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!stocks.length) return;
    currentSector ? showSector(currentSector) : showSectors();
    if (chart) {
      const box = document.getElementById("chart-box");
      chart.resize(box.clientWidth, box.clientHeight);
    }
  }, 150);
});

// 리포트는 부가 정보라 실패해도 페이지는 그대로 동작해야 한다
fetch("reports.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : null))
  .then(d => {
    reports = (d && d.reports) || {};
    if (modal.classList.contains("open")) {
      renderReports(document.getElementById("m-code").textContent.split(" ")[0]);
    }
  })
  .catch(() => { reports = {}; });

// 브라우저 뒤로가기: 종목 화면 → 섹터 히트맵으로 돌아온다(페이지를 벗어나지 않음)
addEventListener("popstate", e => {
  if (!stocks.length) return;
  closeChart();
  const name = e.state ? e.state.sector : new URLSearchParams(location.search).get("sector");
  name && stocks.some(s => s.sector === name) ? showSector(name) : showSectors();
});

Promise.all([
  fetch("data.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("below.json", { cache: "no-cache" }).then(r => (r.ok ? r.json() : null)),
])
  .then(([d, bl]) => {
    dataVersion = d.updated;
    belowMeta = (bl && bl.stocks) || {};
    // ETF는 개별 기업이 아니라 섹터 강도 판단을 흐려서 제외 (30Weeks 페이지에는 그대로 있음)
    stocks = d.stocks.filter(s => s.sector && s.market !== "ETF");
    sectorTotals = d.sector_totals || {};
    document.getElementById("meta-text").textContent =
      `기준: ${d.updated} · 30주선 위 ${fmt(stocks.length)}종목(ETF 제외)을 섹터별로 분류 · 타일이 클수록 해당 섹터에 30주선 위 종목이 많다는 뜻`;
    if (!stocks.length) {
      document.getElementById("heatmap").innerHTML =
        '<div class="empty">섹터 정보가 없습니다. 스크리닝을 다시 실행하세요.</div>';
      return;
    }
    // ?sector=... 로 들어오면 그 섹터를 바로 열어 새로고침·공유에도 화면이 유지된다.
    const initial = new URLSearchParams(location.search).get("sector");
    const valid = initial && stocks.some(s => s.sector === initial);
    history.replaceState({ sector: valid ? initial : null }, "", location.href);
    valid ? showSector(initial) : showSectors();
  })
  .catch(() => {
    document.getElementById("meta-text").textContent = "data.json을 불러오지 못했습니다.";
    document.getElementById("heatmap").innerHTML = '<div class="empty">데이터 없음</div>';
  });
</script>
</body>
</html>
