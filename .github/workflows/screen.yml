name: Daily stock screening

# 호출할 때만 돈다. 자동 예약은 두지 않는다.
#   gh workflow run screen.yml --ref main
# 또는 GitHub 웹 Actions 탭의 Run workflow 버튼.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python screen_stocks.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: update screening data $(date +'%Y-%m-%d')"
          git push
