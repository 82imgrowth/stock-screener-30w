name: Daily stock screening

on:
  schedule:
    # 평일 16:17 KST(07:17 UTC) 목표. 장 마감은 15:30 KST라 종가가 확정된 뒤다.
    # GitHub Actions cron은 보통 25~60분 지연되므로 실제로는 16:45~17:20경 완료된다.
    - cron: "17 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python screen_stocks.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: update screening data $(date +'%Y-%m-%d')"
          git push
