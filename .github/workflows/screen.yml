name: Daily stock screening

on:
  schedule:
    # 평일 16:17 KST(07:17 UTC) 목표. 장 마감은 15:30 KST라 종가가 확정된 뒤다.
    # GitHub Actions cron은 보통 25~60분 지연되므로 실제로는 16:45~17:20경 완료된다.
    - cron: "17 7 * * 1-5"
  workflow_dispatch:
  # 클라우드 routine이 이 브랜치에 빈 커밋을 밀면 실행된다.
  # routine은 GitHub API로 워크플로를 직접 부를 권한이 없지만(403 Resource not
  # accessible by integration), claude/ 접두어 브랜치에는 항상 푸시할 수 있다.
  # 그 푸시를 트리거로 삼아 우회한다.
  push:
    branches: ["claude/run-screening"]

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      # push 이벤트로 들어오면 기본 체크아웃은 claude/run-screening 이다.
      # 스크리닝과 커밋은 반드시 main 기준이어야 하므로 명시한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python screen_stocks.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: update screening data $(date +'%Y-%m-%d')"
          git push
