# 임시 진단용. 판정이 끝나면 이 파일을 지운다.
#
# GitHub이 이 저장소에 schedule 이벤트를 보내는지 아닌지만 확인한다.
# 스크리닝은 건드리지 않는다 — 실행 시간 몇 초, 커밋도 남기지 않는다.
#
# 판정: gh run list -w cron-probe.yml
#   event=schedule 인 실행이 뜬다  → GitHub 예약은 살아 있다. 스크리닝을 다시 예약으로 돌릴 수 있다.
#   1시간(2슬롯)이 지나도 0건      → 이 저장소의 예약 경로는 죽었다. 다른 방식으로 간다.
name: Cron probe (temporary)

on:
  # 30분마다. 하루 한 번짜리로 며칠 기다리지 않고 30분 만에 판정하려는 것이다.
  schedule:
    - cron: "*/30 * * * *"
  # 파일 자체가 유효한지 즉시 확인하려고 같이 둔다.
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trigger and time
        run: |
          echo "트리거: ${{ github.event_name }}"
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M')"
          echo "KST : $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
