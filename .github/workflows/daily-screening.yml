# GitHub의 예약(schedule) 기능은 걷어냈다(2026-09-01).
# 이 저장소에 한해 GitHub이 schedule 이벤트를 보내지 않는다. 4영업일 연속 미발화이고,
# 플랫폼은 정상이었다 — 9/1에 pypa/pip은 07:16 UTC에 발화했는데 우리 07:07 슬롯은
# 빠졌다. 워크플로 파일도 멀쩡하다(같은 날 수동 실행 5.4분 성공). 주석 수정(PR #42),
# 파일명 변경으로 등록부 재생성(PR #43)까지 시도했으나 둘 다 통하지 않았다.
# 고칠 수 있는 영역 밖이라, 동작하지 않는 예약을 남겨 두는 대신 삭제한다.
#
# 이제 이 워크플로는 호출로만 돈다:
#   gh workflow run daily-screening.yml --ref main
# 외부에서 API로 걸어도 같다(workflow_dispatch). 그 경로는 이번 사태 내내 100% 동작했다.
name: Daily stock screening

on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 데이터가 이미 있어도 다시 실행"
        type: boolean
        default: false

permissions:
  contents: write

# 자동 트리거를 여러 겹으로 걸면 두 실행이 겹칠 수 있다. 뒤에 온 실행은 앞 실행이
# 끝날 때까지 통째로 대기하므로, 그때 체크아웃한 data.json에 이미 오늘 데이터가
# 들어 있어 아래 확인 단계에서 바로 끝난다. 겹쳐 돌면 나중 것의 git push가 깨진다.
concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 스크리닝은 9분쯤 걸린다. 행이 걸린 실행이 기본값 6시간을 태우지 않게 한다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 이미 오늘 데이터가 있으면 건너뛴다. 트리거를 이중으로 걸어도(예: 자동 호출 +
      # 놓친 작업 보완) 9분짜리 스크리닝이 중복으로 돌지 않는다.
      # 같은 날 다시 돌리고 싶으면 force 입력을 켠다.
      - id: fresh
        name: Check whether today's data already exists
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          # encoding을 명시한다. 종목명이 한글이라 로캘이 UTF-8이 아니면 읽다 죽는다.
          updated=$(python3 -c "import json,io;print(json.load(io.open('docs/data.json',encoding='utf-8'))['updated'][:10])" 2>/dev/null || echo "")
          if [ "${{ inputs.force }}" != "true" ] && [ "$updated" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$today 데이터가 이미 있어 건너뜁니다 (updated=$updated). 다시 돌리려면 force를 켜세요."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "스크리닝을 진행합니다 (today=$today, updated=${updated:-없음}, force=${{ inputs.force }})"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'

      - run: python screen_stocks.py
        if: steps.fresh.outputs.skip != 'true'

      - name: Commit updated data
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: update screening data $(date +'%Y-%m-%d')"
          git push
