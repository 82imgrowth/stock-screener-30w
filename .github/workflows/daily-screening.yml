name: Daily stock screening

# 호출할 때만 돈다.
#   gh workflow run daily-screening.yml --ref main
# 또는 GitHub 웹 Actions 탭의 Run workflow 버튼.
on:
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치면 나중 것의 git push가 원격이 앞서 있어 깨진다. 줄을 세운다.
concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 스크리닝은 9분쯤 걸린다. 행이 걸린 실행이 기본값 6시간을 태우지 않게 한다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python screen_stocks.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: update screening data $(date +'%Y-%m-%d')"
          git push
